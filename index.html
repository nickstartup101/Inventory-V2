<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Dolce Portal V2.9 - Final Pro</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23050505%22/><text y=%2272%22 x=%2212%22 font-family=%22sans-serif%22 font-size=%2268%22 font-weight=%22900%22 fill=%22%23FF4D00%22>V2</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --primary: #FF4D00; --bg: #050505; --card: #0d0d0d; }
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; outline: none !important; }
        body { font-family: "Noto Sans Lao", sans-serif; background-color: var(--bg); color: #fff; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; }
        
        #top-bar { height: 60px; background: #050505; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 50; shrink: 0; }
        #app-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        aside { width: 240px; background: #0a0a0a; border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; transition: all 0.3s; z-index: 40; }
        main { flex: 1; overflow-y: auto; background: #050505; padding: 25px; }

        @media (max-width: 1024px) {
            aside { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; flex-direction: row !important; border-top: 1px solid #1a1a1a; }
            aside nav { flex-direction: row !important; width: 100%; justify-content: space-around; }
            aside .hide-mobile, .switch-user-box { display: none !important; }
            main { padding: 15px; padding-bottom: 100px; }
        }

        .glass-card { background: var(--card); border: 1px solid #1a1a1a; border-radius: 20px; }
        .tab-active { color: var(--primary) !important; background: rgba(255, 77, 0, 0.1) !important; }
        .pin-btn { height: 60px; background: #161616; border-radius: 15px; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
        .pin-btn:active { background: var(--primary); color: white; transform: scale(0.95); }
        .active-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; border: 1.5px solid #000; position: absolute; bottom: 0; right: 0; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.1); } }
        
        .category-pill { padding: 8px 16px; border-radius: 12px; font-size: 11px; font-weight: 800; background: #111; color: #555; border: 1px solid #1a1a1a; white-space: nowrap; }
        .category-pill.active { background: var(--primary); color: white; border-color: var(--primary); }
        select, input, textarea { background: #111 !important; border: 1px solid #222 !important; color: white; border-radius: 12px; padding: 12px; width: 100%; font-size: 13px; }
        
        /* Modal Animation */
        .modal-enter { animation: modalIn 0.3s ease-out; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header id="top-bar">
        <div class="flex items-center space-x-3">
            <span class="text-2xl font-black text-[#FF4D00]">V2</span>
            <div>
                <p id="live-date" class="text-[8px] font-bold text-neutral-600 uppercase tracking-widest leading-tight"></p>
                <p id="live-time" class="text-base font-black text-white leading-tight"></p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <span class="text-[8px] font-black text-neutral-600 uppercase hidden md:block">Active Staff:</span>
            <div id="active-staff-container" class="flex items-center -space-x-2"></div>
        </div>
    </header>

    <div id="app-container">
        <aside class="no-print">
            <nav class="flex-1 flex flex-col p-3 space-y-1">
                <button onclick="switchTab('tab-dashboard')" id="btn-tab-dashboard" class="flex items-center px-4 py-3 rounded-xl text-sm font-bold text-neutral-400 tab-active">
                    <i class="fa-solid fa-house-chimney w-5 mr-3"></i><span class="hide-mobile">ໜ້າຫຼັກ</span>
                </button>
                <button onclick="switchTab('tab-stock')" id="btn-tab-stock" class="flex items-center px-4 py-3 rounded-xl text-sm font-bold text-neutral-400">
                    <i class="fa-solid fa-box-open w-5 mr-3"></i><span class="hide-mobile">ຈັດການສະຕ໊ອກ</span>
                </button>
                <button onclick="switchTab('tab-clock')" id="btn-tab-clock" class="flex items-center px-4 py-3 rounded-xl text-sm font-bold text-neutral-400">
                    <i class="fa-solid fa-clock w-5 mr-3"></i><span class="hide-mobile">ລົງເວລາເຮັດວຽກ</span>
                </button>
                <div id="hrm-admin-menu" class="hidden pt-4 mt-4 border-t border-neutral-800 space-y-1">
                    <button onclick="switchTab('tab-hrm-staff')" id="btn-tab-hrm-staff" class="flex items-center px-4 py-3 rounded-xl text-sm font-bold text-orange-500">
                        <i class="fa-solid fa-users-gear w-5 mr-3"></i><span class="hide-mobile">ພະນັກງານ</span>
                    </button>
                    <button onclick="switchTab('tab-hrm-payroll')" id="btn-tab-hrm-payroll" class="flex items-center px-4 py-3 rounded-xl text-sm font-bold text-orange-500">
                        <i class="fa-solid fa-calculator w-5 mr-3"></i><span class="hide-mobile">Payroll</span>
                    </button>
                </div>
            </nav>
            <div class="switch-user-box p-4 border-t border-neutral-900">
                <button onclick="openPinModal()" class="w-full py-3 bg-neutral-900 rounded-xl text-[9px] font-black text-neutral-500 hover:text-orange-500 uppercase tracking-tighter">
                    <i class="fa-solid fa-lock mr-1"></i> HRM LOGIN
                </button>
            </div>
        </aside>

        <main>
            <section id="tab-dashboard" class="tab-content space-y-5">
                <div id="category-pills" class="flex overflow-x-auto space-x-2 pb-2 scroll-hide"></div>
                <div id="dashboard-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3"></div>
            </section>

            <section id="tab-stock" class="tab-content hidden space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-black">Stock Management</h2>
                    <button onclick="openAddProductModal()" class="px-4 py-2 bg-[#FF4D00] rounded-xl text-[10px] font-black uppercase">+ ເພີ່ມສິນຄ້າໃໝ່</button>
                </div>
                <div class="max-w-xl mx-auto glass-card p-6 md:p-8 space-y-5">
                    <form onsubmit="handleInventoryRecord(event)" class="space-y-4">
                        <div class="space-y-1">
                            <label class="text-[9px] font-black text-neutral-500 uppercase">ເລືອກສິນຄ້າ</label>
                            <select id="inv-sku" required></select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-1">
                                <label class="text-[9px] font-black text-neutral-500 uppercase">ປະເພດ</label>
                                <select id="inv-type"><option value="IN">ນຳເຂົ້າ (IN)</option><option value="OUT">ເບີກອອກ (OUT)</option></select>
                            </div>
                            <div class="space-y-1">
                                <label class="text-[9px] font-black text-neutral-500 uppercase">ຈຳນວນ</label>
                                <input type="number" id="inv-qty" required placeholder="0">
                            </div>
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] font-black text-neutral-500 uppercase">ເຫດຜົນ</label>
                            <select id="inv-reason" onchange="toggleOtherReason(this.value)">
                                <option value="ຊື້ເພີ່ມ">ຊື້ເພີ່ມ</option><option value="ເຄື່ອງເສຍ/ເພ">ເຄື່ອງເສຍ/ເພ</option><option value="ນັບສະຕ໊ອກ">ນັບສະຕ໊ອກ</option><option value="other">ອື່ນໆ</option>
                            </select>
                            <input type="text" id="inv-reason-other" class="hidden mt-2" placeholder="ລະບຸເຫດຜົນ...">
                        </div>
                        <button type="submit" class="w-full py-4 bg-[#FF4D00] rounded-2xl font-black text-xs uppercase">ບັນທຶກສະຕ໊ອກ</button>
                    </form>
                </div>
            </section>

            <section id="tab-clock" class="tab-content hidden flex flex-col items-center justify-center min-h-[50vh] space-y-6 text-center">
                <h1 class="text-3xl font-black">ປ້ຳໂມງເຮັດວຽກ</h1>
                <p id="clock-msg" class="text-sm font-bold h-6"></p>
                <div class="glass-card p-6 w-72 space-y-5 border-t-4 border-orange-500">
                    <input type="password" id="clock-pin" readonly class="bg-transparent border-none text-center text-3xl font-bold tracking-[0.4em] text-[#FF4D00]">
                    <div id="clock-pinpad" class="grid grid-cols-3 gap-2"></div>
                </div>
            </section>

            <section id="tab-hrm-staff" class="tab-content hidden space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-black">Staff Management</h2>
                    <button onclick="openAddStaffModal()" class="px-4 py-2 bg-[#FF4D00] rounded-xl text-[10px] font-black uppercase">+ ເພີ່ມພະນັກງານ</button>
                </div>
                <div id="staff-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </section>

            <section id="tab-hrm-payroll" class="tab-content hidden space-y-6">
                <h2 class="text-xl font-black">Payroll (Realtime)</h2>
                <div class="glass-card overflow-x-auto">
                    <table class="w-full text-left text-[11px]">
                        <thead class="bg-neutral-900 text-neutral-500 uppercase font-black">
                            <tr>
                                <th class="p-4">ພະນັກງານ</th>
                                <th class="p-4 text-center">ຊົ່ວໂມງລວມ</th>
                                <th class="p-4 text-center">ມື້ເຮັດວຽກ (9ຊມ)</th>
                                <th class="p-4 text-center">OT (ຊົ່ວໂມງ)</th>
                                <th class="p-4 text-right text-orange-500">ລາຍຮັບລວມ (LAK)</th>
                            </tr>
                        </thead>
                        <tbody id="payroll-body" class="divide-y divide-neutral-900"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL: ADD/EDIT STAFF -->
    <div id="staff-form-modal" class="fixed inset-0 bg-black/90 z-[400] hidden flex items-center justify-center p-4 backdrop-blur-md">
        <div class="glass-card w-full max-w-lg p-6 space-y-5 modal-enter overflow-y-auto max-h-[90vh]">
            <h3 class="text-xl font-black text-orange-500">ຂໍ້ມູນພະນັກງານໃໝ່</h3>
            <form onsubmit="handleStaffSave(event)" class="space-y-4">
                <div class="flex flex-col items-center space-y-2">
                    <img id="f-photo-preview" src="https://via.placeholder.com/150" class="w-20 h-20 rounded-2xl object-cover border-2 border-neutral-800">
                    <input type="file" id="f-photo" accept="image/*" onchange="previewFile(this)" class="hidden">
                    <button type="button" onclick="document.getElementById('f-photo').click()" class="text-[10px] text-neutral-500 uppercase font-bold">ອັບໂຫຼດຮູບພາບ</button>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="f-name" placeholder="ຊື່ ແລະ ນາມສະກຸນ" required>
                    <input type="text" id="f-pin" placeholder="PIN 6 ຫຼັກ" maxlength="6" required>
                    <input type="text" id="f-phone" placeholder="ເບີໂທ">
                    <input type="date" id="f-dob">
                    <select id="f-branch"><option value="ສາຂານ້ຳພຸ">ສາຂານ້ຳພຸ</option><option value="ສາຂາໄຊເສດຖາ">ສາຂາໄຊເສດຖາ</option></select>
                    <select id="f-shift"><option value="SHIFT 1">SHIFT 1 (07:00-16:00)</option><option value="SHIFT 2">SHIFT 2 (11:30-20:00)</option></select>
                    <input type="number" id="f-salary" placeholder="ເງິນເດືອນ" value="3500000">
                    <input type="number" id="f-benefit" placeholder="ສະຫວັດດິການ" value="400000">
                </div>
                <div class="flex space-x-3">
                    <button type="button" onclick="closeAddStaffModal()" class="flex-1 py-3 bg-neutral-900 rounded-xl text-xs font-bold uppercase">Cancel</button>
                    <button type="submit" class="flex-1 py-3 bg-orange-500 rounded-xl text-xs font-black uppercase">Save Staff</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: STAFF DETAIL -->
    <div id="staff-detail-modal" class="fixed inset-0 bg-black/90 z-[350] hidden flex items-center justify-center p-6 backdrop-blur-lg">
        <div class="glass-card w-full max-w-sm p-6 space-y-4 border-t-4 border-orange-500 modal-enter">
            <div class="flex flex-col items-center text-center space-y-3">
                <img id="d-photo" class="w-24 h-24 rounded-2xl object-cover border-2 border-neutral-800 shadow-xl shadow-black">
                <div>
                    <h3 id="d-name" class="text-lg font-black"></h3>
                    <p id="d-branch" class="text-[10px] text-orange-500 font-bold uppercase"></p>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3 text-[11px] bg-neutral-900/50 p-4 rounded-xl border border-neutral-800">
                <div><p class="text-neutral-500">ເບີໂທ:</p><p id="d-phone" class="font-bold"></p></div>
                <div><p class="text-neutral-500">ວັນເກີດ:</p><p id="d-dob" class="font-bold"></p></div>
                <div><p class="text-neutral-500">ກະວຽກ:</p><p id="d-shift" class="font-bold"></p></div>
                <div><p class="text-neutral-500">PIN:</p><p id="d-pin" class="font-bold mono text-orange-500"></p></div>
                <div><p class="text-neutral-500">ເງິນເດືອນ:</p><p id="d-salary" class="font-bold"></p></div>
                <div><p class="text-neutral-500">ສະຫວັດດິການ:</p><p id="d-benefit" class="font-bold"></p></div>
            </div>
            <button onclick="closeStaffDetail()" class="w-full py-3 bg-neutral-900 rounded-xl text-xs font-bold uppercase hover:bg-neutral-800 transition-all">ປິດໜ້າຕ່າງ</button>
        </div>
    </div>

    <div id="pin-modal" class="fixed inset-0 bg-black/95 z-[300] hidden flex flex-col items-center justify-center p-6 backdrop-blur-xl">
        <div class="w-full max-w-xs space-y-10 text-center">
            <span class="text-4xl font-black text-orange-500">V2 HRM</span>
            <input type="password" id="admin-pin-display" readonly class="w-full bg-transparent border-b-2 border-orange-500 text-center text-5xl font-bold tracking-[0.5em] text-white pb-4 outline-none">
            <div id="admin-pinpad" class="grid grid-cols-3 gap-3"></div>
            <button onclick="closePinModal()" class="w-full py-4 text-neutral-600 font-bold uppercase text-xs">Close</button>
        </div>
    </div>

    <div id="product-modal" class="fixed inset-0 bg-black/90 z-[250] hidden flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="glass-card w-full max-w-md p-8 space-y-6 border-t-4 border-orange-500">
            <h3 class="text-2xl font-black text-orange-500">ເພີ່ມສິນຄ້າໃໝ່</h3>
            <form onsubmit="handleNewProduct(event)" class="space-y-4">
                <input type="text" id="p-sku" readonly class="font-mono text-orange-500 font-bold">
                <input type="text" id="p-name" placeholder="ຊື່ສິນຄ້າ" required>
                <input type="text" id="p-category" placeholder="ໝວດໝູ່ (ເຊັ່ນ: ວັດຖຸດິບ, ໄຊຣັບ)" required>
                <input type="number" id="p-min" placeholder="Stock ຂັ້ນຕ່ຳ (ເຕືອນສັ່ງດ່ວນ)" value="5" required>
                <input type="number" id="p-stock" placeholder="ຈຳນວນເລີ່ມຕົ້ນ" required>
                <div class="flex space-x-3 pt-4">
                    <button type="button" onclick="closeAddProductModal()" class="flex-1 py-4 bg-neutral-900 rounded-2xl font-bold text-xs uppercase">Cancel</button>
                    <button type="submit" class="flex-1 py-4 bg-orange-500 rounded-2xl font-black text-xs uppercase">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const S_URL = "https://jxkcnraixazvmwdfmraa.supabase.co";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4a2NucmFpeGF6dm13ZGZtcmFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2OTEzMjQsImV4cCI6MjEwMDI2NzMyNH0.qsu7QGAUT0IFR53FNXIMp52jS8DfTxl0GDAljA-T2T0";
        const client = supabase.createClient(S_URL, S_KEY);

        let products = [], staff = [], attendance = [], activeCategory = 'ວັດຖຸດິບ';
        let adminPin = "", clockPin = "", base64Photo = "";

        function getLaosTime() {
            const now = new Date();
            return now.toLocaleString('sv-SE', { timeZone: 'Asia/Vientiane' }).replace(' ', 'T');
        }

        async function init() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('live-time').innerText = now.toLocaleTimeString('en-GB', { timeZone: 'Asia/Vientiane', hour12: false });
                document.getElementById('live-date').innerText = now.toLocaleDateString('lo-LA', { timeZone: 'Asia/Vientiane', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            }, 1000);
            await fetchData(); renderDashboard(); renderActiveStaff(); renderPinPads(); populateSkuSelect();
        }

        async function fetchData() {
            const [p, s, a] = await Promise.all([
                client.from('main_inventory').select('*'),
                client.from('staff').select('*'),
                client.from('attendance').select('*')
            ]);
            products = p.data || []; staff = s.data || []; attendance = a.data || [];
        }

        function renderDashboard() {
            const grid = document.getElementById('dashboard-grid');
            const pills = document.getElementById('category-pills');
            grid.innerHTML = "";
            const cats = ['ວັດຖຸດິບ', ...new Set(products.map(p => p.category).filter(c => c !== 'ວັດຖຸດິບ'))];
            pills.innerHTML = cats.map(c => `<button onclick="filterCategory('${c}')" class="category-pill ${activeCategory === c ? 'active' : ''}">${c}</button>`).join('') + `<button onclick="filterCategory('ALL')" class="category-pill ${activeCategory === 'ALL' ? 'active' : ''}">ທັງໝົດ</button>`;
            products.filter(p => activeCategory === 'ALL' || p.category === activeCategory).forEach(p => {
                const min = p.min_stock || 5;
                const urgent = p.stock <= min;
                grid.innerHTML += `
                    <div class="glass-card p-4 space-y-3 border-t-2 ${urgent ? 'border-orange-500' : 'border-emerald-500'}">
                        <div class="flex justify-between items-start"><span class="text-[8px] font-mono text-neutral-600">${p.sku}</span><span class="px-2 py-0.5 rounded-lg text-[7px] font-black uppercase ${urgent ? 'text-orange-500 bg-orange-500/10' : 'text-emerald-500 bg-emerald-500/10'}">${urgent ? 'ສັ່ງດ່ວນ!' : 'OK'}</span></div>
                        <h4 class="font-black text-[11px] truncate" title="${p.name}">${p.name}</h4><span class="text-2xl font-black mono ${urgent ? 'text-orange-500' : 'text-white'}">${p.stock}</span>
                    </div>`;
            });
        }

        function renderActiveStaff() {
            const container = document.getElementById('active-staff-container');
            container.innerHTML = "";
            const today = getLaosTime().split('T')[0];
            const activeStaff = staff.filter(s => {
                const logs = attendance.filter(a => a.pin === s.pin && a.timestamp.split('T')[0] === today);
                return logs.length % 2 !== 0;
            });
            activeStaff.forEach(s => {
                container.innerHTML += `<div class="relative"><img src="${s.photo_url || 'https://via.placeholder.com/150'}" class="w-8 h-8 rounded-full object-cover border-2 border-black"><div class="active-dot"></div></div>`;
            });
        }

        function renderPinPads() {
            const keys = ['1','2','3','4','5','6','7','8','9','C','0','OK'];
            const html = keys.map(k => `<button onclick="handlePin('${k}', this)" class="pin-btn">${k}</button>`).join('');
            document.getElementById('clock-pinpad').innerHTML = html.replace(/handlePin/g, 'handleClockPin');
            document.getElementById('admin-pinpad').innerHTML = html.replace(/handlePin/g, 'handleAdminPin');
        }

        function handleClockPin(k) {
            if (k === 'C') clockPin = ""; else if (k === 'OK') submitClock(); else if (clockPin.length < 6) clockPin += k;
            document.getElementById('clock-pin').value = clockPin;
        }

        async function submitClock() {
            const user = staff.find(s => s.pin === clockPin);
            const msg = document.getElementById('clock-msg');
            if (!user) { alert("PIN ຜິດ"); clockPin = ""; document.getElementById('clock-pin').value = ""; return; }
            
            const nowTime = getLaosTime();
            const today = nowTime.split('T')[0];
            // Filter strictly by today's logs for this specific PIN
            const todayLogs = attendance.filter(a => a.pin === clockPin && a.timestamp.split('T')[0] === today).sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
            
            const actionType = (todayLogs.length % 2 === 0) ? "Clock-In" : "Clock-Out";

            const { error } = await client.from('attendance').insert([{ 
                pin: clockPin, 
                timestamp: nowTime, 
                branch: user.branch,
                type: actionType 
            }]);

            if (error) { alert("Error"); return; }

            if (actionType === "Clock-In") {
                msg.innerText = `✅ ${user.name}: ສຳເລັດແລ້ວ (ເຂົ້າວຽກ)`;
                msg.style.color = "#10b981";
            } else {
                // Find first In of today to calculate daily total
                const firstIn = new Date(todayLogs[0].timestamp);
                const diff = (new Date(nowTime) - firstIn) / (1000 * 60 * 60);
                msg.innerText = `✅ ${user.name}: ເຮັດວຽກມື້ນີ້ ${diff.toFixed(1)} ຊົ່ວໂມງ`;
                msg.style.color = "#FF4D00";
            }
            clockPin = ""; document.getElementById('clock-pin').value = "";
            await fetchData(); renderActiveStaff();
            setTimeout(() => msg.innerText = "", 5000);
        }

        function renderStaffList() {
            document.getElementById('staff-list').innerHTML = staff.map(s => `
                <div onclick="showStaffDetail('${s.pin}')" class="glass-card p-4 flex items-center space-x-3 border-l-4 border-orange-500 cursor-pointer hover:bg-white/5">
                    <img src="${s.photo_url || 'https://via.placeholder.com/150'}" class="w-12 h-12 rounded-xl object-cover">
                    <div>
                        <h4 class="font-black text-xs">${s.name}</h4>
                        <p class="text-[8px] text-neutral-500 uppercase font-bold">${s.branch}</p>
                    </div>
                </div>`).join('');
        }

        function showStaffDetail(pin) {
            const s = staff.find(x => x.pin === pin);
            if (!s) return;
            document.getElementById('d-photo').src = s.photo_url || 'https://via.placeholder.com/150';
            document.getElementById('d-name').innerText = s.name;
            document.getElementById('d-branch').innerText = s.branch;
            document.getElementById('d-phone').innerText = s.phone || '-';
            document.getElementById('d-dob').innerText = s.dob || '-';
            document.getElementById('d-shift').innerText = s.shift || '-';
            document.getElementById('d-pin').innerText = s.pin;
            document.getElementById('d-salary').innerText = (s.salary || 0).toLocaleString() + " LAK";
            document.getElementById('d-benefit').innerText = (s.benefit || 0).toLocaleString() + " LAK";
            document.getElementById('staff-detail-modal').classList.remove('hidden');
        }

        function closeStaffDetail() { document.getElementById('staff-detail-modal').classList.add('hidden'); }

        function renderPayroll() {
            const body = document.getElementById('payroll-body');
            body.innerHTML = "";
            const month = new Date().getMonth();
            const year = new Date().getFullYear();

            staff.forEach(s => {
                const logs = attendance.filter(a => {
                    const d = new Date(a.timestamp);
                    return a.pin === s.pin && d.getMonth() === month && d.getFullYear() === year;
                }).sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));

                const dailyGroups = {};
                logs.forEach(l => {
                    const date = l.timestamp.split('T')[0];
                    if (!dailyGroups[date]) dailyGroups[date] = [];
                    dailyGroups[date].push(new Date(l.timestamp));
                });

                let totalHrs = 0;
                let otHrs = 0;
                for (let date in dailyGroups) {
                    const times = dailyGroups[date].sort((a,b) => a-b);
                    if (times.length >= 2) {
                        const dayDiff = (times[times.length - 1] - times[0]) / (1000 * 60 * 60);
                        totalHrs += dayDiff;
                        if (dayDiff > 9) otHrs += (dayDiff - 9);
                    }
                }

                const workDays = totalHrs / 9;
                const netPay = (s.salary / 26 * workDays) + (s.benefit || 0);

                body.innerHTML += `
                    <tr>
                        <td class="p-4 font-bold">${s.name}</td>
                        <td class="p-4 text-center mono">${totalHrs.toFixed(1)}</td>
                        <td class="p-4 text-center font-bold text-emerald-500">${workDays.toFixed(1)}</td>
                        <td class="p-4 text-center font-bold text-orange-500">${otHrs.toFixed(1)}</td>
                        <td class="p-4 text-right font-black text-orange-500">${Math.round(netPay).toLocaleString()}</td>
                    </tr>`;
            });
        }

        // --- NEW STAFF MANAGEMENT ---
        function previewFile(input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onloadend = () => {
                base64Photo = reader.result;
                document.getElementById('f-photo-preview').src = base64Photo;
            };
            if (file) reader.readAsDataURL(file);
        }

        async function handleStaffSave(e) {
            e.preventDefault();
            const payload = {
                name: document.getElementById('f-name').value,
                pin: document.getElementById('f-pin').value,
                phone: document.getElementById('f-phone').value,
                dob: document.getElementById('f-dob').value,
                branch: document.getElementById('f-branch').value,
                shift: document.getElementById('f-shift').value,
                salary: parseInt(document.getElementById('f-salary').value),
                benefit: parseInt(document.getElementById('f-benefit').value),
                photo_url: base64Photo
            };
            const { error } = await client.from('staff').insert([payload]);
            if (error) alert("Error saving staff"); else { alert("Success"); closeAddStaffModal(); init(); }
        }

        function filterCategory(c) { activeCategory = c; renderDashboard(); }
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active'));
            document.getElementById('btn-' + id).classList.add('tab-active');
            if (id === 'tab-hrm-staff') renderStaffList();
            if (id === 'tab-hrm-payroll') renderPayroll();
        }
        function populateSkuSelect() {
            const filtered = products.filter(p => !p.sku.endsWith('XS')).sort((a,b) => a.sku.localeCompare(b.sku, undefined, {numeric: true}));
            document.getElementById('inv-sku').innerHTML = filtered.map(p => `<option value="${p.sku}">${p.sku} - ${p.name}</option>`).join('');
        }
        async function handleInventoryRecord(e) {
            e.preventDefault();
            const sku = document.getElementById('inv-sku').value;
            const type = document.getElementById('inv-type').value;
            const qty = parseInt(document.getElementById('inv-qty').value);
            const p = products.find(x => x.sku === sku);
            const newStock = type === 'IN' ? p.stock + qty : p.stock - qty;
            await client.from('main_inventory').update({ stock: newStock }).eq('sku', sku);
            await client.from('daily_inventory_movement').insert([{ sku, name: p.name, type, qty, note: document.getElementById('inv-reason').value, timestamp: getLaosTime() }]);
            alert("Success"); init(); switchTab('tab-dashboard');
        }
        async function handleNewProduct(e) {
            e.preventDefault();
            const payload = { sku: document.getElementById('p-sku').value, name: document.getElementById('p-name').value, category: document.getElementById('p-category').value, min_stock: parseInt(document.getElementById('p-min').value), stock: parseInt(document.getElementById('p-stock').value) };
            await client.from('main_inventory').insert([payload]); closeAddProductModal(); init();
        }

        function openPinModal() { document.getElementById('pin-modal').classList.remove('hidden'); adminPin = ""; }
        function closePinModal() { document.getElementById('pin-modal').classList.add('hidden'); }
        function openAddStaffModal() { document.getElementById('staff-form-modal').classList.remove('hidden'); }
        function closeAddStaffModal() { document.getElementById('staff-form-modal').classList.add('hidden'); base64Photo = ""; }
        function openAddProductModal() { document.getElementById('p-sku').value = "P" + String(products.length + 1).padStart(3, '0'); document.getElementById('product-modal').classList.remove('hidden'); }
        function closeAddProductModal() { document.getElementById('product-modal').classList.add('hidden'); }
        function toggleOtherReason(v) { document.getElementById('inv-reason-other').classList.toggle('hidden', v !== 'other'); }
        function handleAdminPin(k) { if (k === 'C') adminPin = ""; else if (k === 'OK') { if (adminPin === "9999") { document.getElementById('hrm-admin-menu').classList.remove('hidden'); closePinModal(); } else { alert("PIN Wrong"); adminPin = ""; } } else if (adminPin.length < 4) adminPin += k; document.getElementById('admin-pin-display').value = adminPin; }

        window.onload = init;
    </script>
</body>
