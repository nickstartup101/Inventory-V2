<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Dolce Portal V2.2 - ລະບົບຄຸ້ມຄອງພະນັກງານ</title>
    
    <!-- Fonts & Tailwind -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            font-family: "Noto Sans Lao", sans-serif;
            background-color: #050505;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* SIDEBAR STYLE */
        #app-sidebar {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 260px;
            background: #0a0a0a;
            border-right: 1px solid #1a1a1a;
        }
        #app-sidebar.collapsed { width: 80px; }
        #app-sidebar.collapsed .sidebar-text { display: none; }
        #app-sidebar.collapsed .sidebar-header { justify-content: center; }
        #app-sidebar.collapsed nav button { justify-content: center; padding: 12px 0; }
        #app-sidebar.collapsed nav button i { margin-right: 0; font-size: 1.2rem; }

        .glass-card {
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            border-radius: 20px;
        }
        
        .tab-active {
            background-color: #FF4D00 !important;
            color: white !important;
        }

        .mono { font-family: "JetBrains Mono", monospace; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        @media print {
            .no-print { display: none !important; }
            body { background: white; color: black; display: block; overflow: visible; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #ddd; padding: 8px; color: black !important; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside id="app-sidebar" class="flex flex-col h-full no-print shrink-0">
        <div class="p-5 border-b border-neutral-800 flex items-center justify-between sidebar-header">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-black text-[#FF4D00]">V2</span>
                <span class="sidebar-text font-bold text-sm tracking-tighter">LA DOLCE PORTAL</span>
            </div>
            <button onclick="toggleSidebar()" class="p-1.5 rounded-lg bg-neutral-900 text-neutral-400 hover:text-white">
                <i id="toggle-icon" class="fa-solid fa-angles-left text-xs"></i>
            </button>
        </div>

        <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
            <button onclick="switchTab('tab-dashboard')" id="btn-tab-dashboard" class="w-full flex items-center px-4 py-3 rounded-xl text-sm font-medium text-neutral-400 hover:bg-neutral-900 tab-active">
                <i class="fa-solid fa-chart-pie w-5 mr-3 text-center"></i>
                <span class="sidebar-text">Dashboard</span>
            </button>
            <button onclick="switchTab('tab-stock')" id="btn-tab-stock" class="w-full flex items-center px-4 py-3 rounded-xl text-sm font-medium text-neutral-400 hover:bg-neutral-900">
                <i class="fa-solid fa-boxes-stacked w-5 mr-3 text-center"></i>
                <span class="sidebar-text">Stock ສິນຄ້າ</span>
            </button>
            <button onclick="switchTab('tab-attendance')" id="btn-tab-attendance" class="w-full flex items-center px-4 py-3 rounded-xl text-sm font-medium text-neutral-400 hover:bg-neutral-900">
                <i class="fa-solid fa-fingerprint w-5 mr-3 text-center"></i>
                <span class="sidebar-text">ລົງເວລາເຮັດວຽກ</span>
            </button>

            <!-- Admin Section -->
            <div id="admin-menu" class="hidden pt-4 mt-4 border-t border-neutral-800">
                <button onclick="switchTab('tab-payroll')" id="btn-tab-payroll" class="w-full flex items-center px-4 py-3 rounded-xl text-sm font-medium text-neutral-400 hover:bg-neutral-900">
                    <i class="fa-solid fa-calculator w-5 mr-3 text-center"></i>
                    <span class="sidebar-text text-orange-500">Payroll (ເງິນເດືອນ)</span>
                </button>
            </div>
        </nav>

        <div class="p-4 border-t border-neutral-800">
            <button onclick="loginAdmin()" id="admin-btn" class="w-full py-2 bg-neutral-900 border border-neutral-800 rounded-xl text-[10px] font-bold hover:border-[#FF4D00]">
                <i class="fa-solid fa-lock mr-2 text-[#FF4D00]"></i>
                <span class="sidebar-text">ADMIN LOGIN</span>
            </button>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 overflow-y-auto p-6">
        
        <!-- Tab 1: Dashboard -->
        <section id="tab-dashboard" class="tab-content space-y-6">
            <header class="flex justify-between items-center no-print">
                <h1 class="text-2xl font-black">Dashboard</h1>
                <select id="branch-filter" onchange="renderStock()" class="bg-neutral-900 px-4 py-2 rounded-xl text-xs font-bold border-none outline-none text-[#FF4D00]">
                    <option value="ALL">ທຸກສາຂາ</option>
                </select>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="glass-card p-6 border-l-4 border-[#FF4D00]">
                    <p class="text-[10px] font-bold text-neutral-500 uppercase">ເວລາປະຈຳວັນ</p>
                    <div id="live-clock" class="text-xl font-black mt-1">00:00:00</div>
                </div>
                <div class="glass-card p-6">
                    <p class="text-[10px] font-bold text-neutral-500 uppercase">ພະນັກງານໃນຮ້ານ</p>
                    <div id="active-staff-count" class="text-xl font-black mt-1">0 ຄົນ</div>
                </div>
            </div>

            <div class="glass-card p-6">
                <h3 class="font-bold mb-4">Stock ສິນຄ້າປັດຈຸບັນ</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="text-neutral-500 border-b border-neutral-800">
                            <tr>
                                <th class="pb-3">ຊື່ສິນຄ້າ</th>
                                <th class="pb-3 text-center">ຄົງເຫຼືອ</th>
                                <th class="pb-3 text-right">ສາຂາ</th>
                            </tr>
                        </thead>
                        <tbody id="stock-list" class="divide-y divide-neutral-900"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Tab 2: Stock Update -->
        <section id="tab-stock" class="tab-content hidden space-y-6">
            <div class="max-w-lg mx-auto glass-card p-8">
                <h2 class="text-xl font-black mb-6 text-[#FF4D00]">Update Inventory</h2>
                <form onsubmit="updateInventory(event)" class="space-y-4">
                    <div>
                        <label class="text-xs font-bold text-neutral-500 block mb-1">ເລືອກສິນຄ້າ</label>
                        <select id="inv-sku" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-sm outline-none"></select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <select id="inv-type" class="bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-sm outline-none">
                            <option value="IN">ນຳເຂົ້າ (IN)</option>
                            <option value="OUT">ເບີກອອກ (OUT)</option>
                        </select>
                        <input type="number" id="inv-qty" placeholder="ຈຳນວນ" required class="bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-sm outline-none">
                    </div>
                    <button type="submit" class="w-full py-4 bg-[#FF4D00] text-white font-black rounded-xl hover:scale-[0.98] transition-all">ບັນທຶກສະຕ໊ອກ</button>
                </form>
            </div>
        </section>

        <!-- Tab 3: Attendance -->
        <section id="tab-attendance" class="tab-content hidden flex flex-col items-center justify-center h-full space-y-6">
            <div class="text-center">
                <h1 class="text-3xl font-black">Clock In / Out</h1>
                <p class="text-neutral-500 mt-2">ໃສ່ລະຫັດ PIN 6 ຫຼັກ ເພື່ອລົງເວລາ</p>
            </div>
            <div class="glass-card p-8 w-80 space-y-4">
                <input type="password" id="pin-input" readonly class="w-full bg-black border border-neutral-800 rounded-2xl py-4 text-center text-2xl font-bold tracking-[0.5em] text-[#FF4D00]">
                <div class="grid grid-cols-3 gap-3">
                    <button onclick="addPin('1')" class="h-14 rounded-xl bg-neutral-900 text-xl font-bold hover:bg-neutral-800">1</button>
                    <button onclick="addPin('2')" class="h-14 rounded-xl bg-neutral-900 text-xl font-bold hover:bg-neutral-800">2</button>
                    <button onclick="addPin('3')" class="h-14 rounded-xl bg-neutral-900 text-xl font-bold hover:bg-neutral-800">3</button>
                    <button onclick="addPin('4')" class="h-14 rounded-xl bg-neutral-900 text-xl font-bold hover:bg-neutral-800">4</button>
                    <button onclick="addPin('5')" class="h-14 rounded-xl bg-neutral-900 text-xl font-bold hover:bg-neutral-800">5</button>
                    <button onclick="addPin('6')" class="h-14 rounded-xl bg-neutral-900 text-xl font-bold hover:bg-neutral-800">6</button>
                    <button onclick="addPin('7')" class="h-14 rounded-xl bg-neutral-900 text-xl font-bold hover:bg-neutral-800">7</button>
                    <button onclick="addPin('8')" class="h-14 rounded-xl bg-neutral-900 text-xl font-bold hover:bg-neutral-800">8</button>
                    <button onclick="addPin('9')" class="h-14 rounded-xl bg-neutral-900 text-xl font-bold hover:bg-neutral-800">9</button>
                    <button onclick="clearPin()" class="h-14 rounded-xl bg-rose-950 text-rose-500 font-bold">C</button>
                    <button onclick="addPin('0')" class="h-14 rounded-xl bg-neutral-900 text-xl font-bold hover:bg-neutral-800">0</button>
                    <button onclick="clockSubmit()" class="h-14 rounded-xl bg-[#FF4D00] text-white font-bold">OK</button>
                </div>
            </div>
        </section>

        <!-- Tab 4: Payroll (Admin) -->
        <section id="tab-payroll" class="tab-content hidden space-y-6">
            <header class="flex justify-between items-center no-print">
                <h1 class="text-2xl font-black">Payroll Realtime</h1>
                <button onclick="window.print()" class="px-6 py-2 bg-white text-black rounded-xl text-xs font-bold">ພິມລາຍງານ</button>
            </header>
            <div class="glass-card p-6 print-area">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-neutral-500 text-[10px] uppercase border-b border-neutral-800">
                                <th class="pb-4">ພະນັກງານ</th>
                                <th class="pb-4 text-center">ຊົ່ວໂມງລວມ</th>
                                <th class="pb-4 text-center">ມື້ເຮັດວຽກ (9ຊມ)</th>
                                <th class="pb-4 text-center">OT (ຊົ່ວໂມງ)</th>
                                <th class="pb-4 text-right">ລາຍຮັບລວມ (LAK)</th>
                            </tr>
                        </thead>
                        <tbody id="payroll-list" class="divide-y divide-neutral-900 text-sm"></tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <script>
        // --- ຄ່າກຳນົດເບື້ອງຕົ້ນ ---
        const S_URL = "https://jxkcnraixazvmwdfmraa.supabase.co";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4a2NucmFpeGF6dm13ZGZtcmFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2OTEzMjQsImV4cCI6MjEwMDI2NzMyNH0.qsu7QGAUT0IFR53FNXIMp52jS8DfTxl0GDAljA-T2T0";
        
        // ປ່ຽນຊື່ຕົວປ່ຽນເພື່ອບໍ່ໃຫ້ຕຳກັບ Library
        const clientSupabase = supabase.createClient(S_URL, S_KEY);

        let localDB = { products: [], staff: [], attendance: [] };
        let pinStr = "";

        // --- ລະບົບຫຼັກ ---
        async function startApp() {
            await refreshData();
            renderStock();
            populateSelects();
            
            // Live Clock
            setInterval(() => {
                document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('en-GB');
            }, 1000);
        }

        async function refreshData() {
            const { data: p } = await clientSupabase.from('main_inventory').select('*');
            const { data: s } = await clientSupabase.from('staff').select('*');
            const { data: a } = await clientSupabase.from('attendance').select('*');
            
            localDB.products = p || [];
            localDB.staff = s || [];
            localDB.attendance = a || [];
        }

        function toggleSidebar() {
            const sb = document.getElementById('app-sidebar');
            const icon = document.getElementById('toggle-icon');
            sb.classList.toggle('collapsed');
            icon.classList.toggle('fa-angles-left');
            icon.classList.toggle('fa-angles-right');
        }

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active'));
            document.getElementById('btn-' + id).classList.add('tab-active');
            
            if(id === 'tab-payroll') renderPayroll();
        }

        function renderStock() {
            const branch = document.getElementById('branch-filter').value;
            const list = document.getElementById('stock-list');
            list.innerHTML = "";
            
            localDB.products.filter(p => branch === 'ALL' || p.branch === branch).forEach(p => {
                list.innerHTML += `
                    <tr>
                        <td class="py-4 font-bold">${p.name}</td>
                        <td class="py-4 text-center font-mono text-lg ${p.stock <= 5 ? 'text-rose-500' : 'text-emerald-500'}">${p.stock}</td>
                        <td class="py-4 text-right text-[10px] text-neutral-500">${p.branch}</td>
                    </tr>
                `;
            });
        }

        function populateSelects() {
            const invSku = document.getElementById('inv-sku');
            invSku.innerHTML = localDB.products.map(p => `<option value="${p.sku}">${p.name} (${p.branch})</option>`).join('');
            
            const branches = [...new Set(localDB.staff.map(s => s.branch))];
            const filter = document.getElementById('branch-filter');
            branches.forEach(b => filter.innerHTML += `<option value="${b}">${b}</option>`);
        }

        // --- ຄຳນວນເງິນເດືອນ (9 ຊົ່ວໂມງ = 1 ມື້) ---
        function renderPayroll() {
            const list = document.getElementById('payroll-list');
            list.innerHTML = "";

            localDB.staff.forEach(st => {
                // ດຶງຂໍ້ມູນການລົງເວລາຂອງຄົນນີ້
                const logs = localDB.attendance.filter(a => a.pin === st.pin);
                
                // ແຍກຂໍ້ມູນເປັນລາຍວັນ
                const dailyGroup = {};
                logs.forEach(l => {
                    const d = new Date(l.timestamp).toLocaleDateString();
                    if(!dailyGroup[d]) dailyGroup[d] = [];
                    dailyGroup[d].push(new Date(l.timestamp));
                });

                let totalHrs = 0;
                for(let day in dailyGroup) {
                    const times = dailyGroup[day].sort((a,b) => a-b);
                    if(times.length >= 2) {
                        const diff = (times[times.length - 1] - times[0]) / (1000 * 60 * 60);
                        totalHrs += diff;
                    }
                }

                // ສູດຄິດໄລ່: 9 ຊມ = 1 ມື້
                const workDays = totalHrs / 9;
                const otHours = Math.max(0, totalHrs - (Math.floor(workDays) * 9));
                
                const base = st.salary || 3500000;
                const benefit = st.benefit || 400000;
                const otPay = otHours * 17000;
                const netPay = (base / 26 * Math.min(26, workDays)) + benefit + otPay;

                list.innerHTML += `
                    <tr class="hover:bg-neutral-900/50">
                        <td class="py-4">
                            <div class="font-bold">${st.name}</div>
                            <div class="text-[10px] text-neutral-500">${st.branch}</div>
                        </td>
                        <td class="py-4 text-center font-mono">${totalHrs.toFixed(1)}</td>
                        <td class="py-4 text-center">
                            <span class="bg-emerald-950 text-emerald-500 px-2 py-0.5 rounded text-xs font-bold">${workDays.toFixed(1)} ມື້</span>
                        </td>
                        <td class="py-4 text-center text-orange-500 font-bold">${otHours.toFixed(1)}</td>
                        <td class="py-4 text-right font-black text-[#FF4D00]">${Math.round(netPay).toLocaleString()} LAK</td>
                    </tr>
                `;
            });
        }

        // --- ສ່ວນຂອງ Stock ---
        async function updateInventory(e) {
            e.preventDefault();
            const sku = document.getElementById('inv-sku').value;
            const type = document.getElementById('inv-type').value;
            const qty = parseInt(document.getElementById('inv-qty').value);
            
            const prod = localDB.products.find(p => p.sku === sku);
            const newStock = type === 'IN' ? prod.stock + qty : prod.stock - qty;

            const { error } = await clientSupabase.from('main_inventory').update({ stock: newStock }).eq('sku', sku);
            
            if(!error) {
                alert("ອັບເດດສຳເລັດ!");
                await refreshData();
                renderStock();
                e.target.reset();
            }
        }

        // --- ສ່ວນຂອງ PIN ---
        function addPin(n) {
            if(pinStr.length < 6) {
                pinStr += n;
                document.getElementById('pin-input').value = pinStr;
            }
        }
        function clearPin() {
            pinStr = "";
            document.getElementById('pin-input').value = "";
        }
        async function clockSubmit() {
            const user = localDB.staff.find(s => s.pin === pinStr);
            if(!user) return alert("PIN ບໍ່ຖືກຕ້ອງ");

            const { error } = await clientSupabase.from('attendance').insert([{
                pin: pinStr,
                timestamp: new Date().toISOString(),
                branch: user.branch
            }]);

            if(!error) {
                alert("ລົງເວລາສຳເລັດ: " + user.name);
                await refreshData();
                clearPin();
            }
        }

        function loginAdmin() {
            const p = prompt("ໃສ່ລະຫັດ Admin:");
            if(p === "9999") {
                document.getElementById('admin-menu').classList.remove('hidden');
                document.getElementById('admin-btn').innerHTML = "ADMIN ACTIVE";
                switchTab('tab-payroll');
            }
        }

        // Start
        window.onload = startApp;
    </script>
</body>
</html>
