<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Dolce Portal V2 - HRM & Inventory</title>
    
    <!-- Favicon V2 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23050505%22/><text y=%2272%22 x=%2212%22 font-family=%22sans-serif%22 font-size=%2268%22 font-weight=%22900%22 fill=%22%23FF4D00%22>V2</text></svg>">
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --primary: #FF4D00; --bg: #050505; --card: #0d0d0d; }
        * { touch-action: manipulation; } /* ປ້ອງກັນ Zoom ເມື່ອກົດປຸ່ມໄວໆ */
        body { font-family: "Noto Sans Lao", sans-serif; background-color: var(--bg); color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* SIDEBAR (Tablet/PC) */
        aside { width: 260px; background: #0a0a0a; border-right: 1px solid #1a1a1a; transition: 0.3s; z-index: 100; }
        @media (max-width: 1024px) {
            aside { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; border-right: none; border-top: 1px solid #1a1a1a; flex-direction: row !important; padding: 0 !important; }
            aside .hide-mobile { display: none !important; }
            aside nav { flex-direction: row !important; justify-content: space-around; width: 100%; height: 100%; }
            aside nav button { flex-direction: column; font-size: 10px !important; padding: 10px 0 !important; }
            aside nav button i { margin: 0 0 4px 0 !important; font-size: 18px; }
            main { padding-bottom: 90px !important; }
            .switch-user-box { display: none !important; } /* HRM switch moved to bottom in mobile via specific logic if needed */
        }

        .glass-card { background: var(--card); border: 1px solid #1a1a1a; border-radius: 20px; transition: 0.3s; position: relative; overflow: hidden; }
        .tab-active { color: var(--primary) !important; background: rgba(255, 77, 0, 0.1) !important; border-bottom: 2px solid var(--primary); }
        .mono { font-family: "JetBrains Mono", monospace; }

        /* PULSING DOT */
        .active-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; position: absolute; bottom: 2px; right: 2px; border: 2px solid #000; box-shadow: 0 0 10px #10b981; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.7; } 70% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.7; } }

        /* CUSTOM PIN PAD */
        .pin-btn { height: 60px; border-radius: 15px; background: #161616; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .pin-btn:active { background: #FF4D00; color: white; }

        .category-pill { white-space: nowrap; padding: 8px 16px; border-radius: 12px; font-size: 12px; font-weight: bold; background: #161616; color: #666; transition: 0.2s; border: 1px solid transparent; }
        .category-pill.active { background: var(--primary); color: white; }

        input, select, textarea { background: #111 !important; border: 1px solid #222 !important; color: white; border-radius: 12px; padding: 12px; outline: none; }
        input:focus { border-color: var(--primary) !important; }
    </style>
</head>
<body class="lg:flex-row">

    <!-- SIDEBAR -->
    <aside class="flex flex-col shrink-0 no-print">
        <div class="hide-mobile p-6 flex items-center space-x-3">
            <span class="text-3xl font-black text-[#FF4D00]">V2</span>
            <div>
                <h1 class="font-black text-sm leading-none">LA DOLCE</h1>
                <p class="text-[9px] text-neutral-500 font-bold uppercase mt-1">Portal V2.5</p>
            </div>
        </div>

        <nav class="flex-1 flex flex-col p-3 space-y-1">
            <button onclick="switchTab('tab-dashboard')" id="btn-tab-dashboard" class="flex items-center px-4 py-3 rounded-xl text-sm font-bold text-neutral-400 tab-active">
                <i class="fa-solid fa-chart-line w-5 mr-3"></i><span class="hide-mobile">Dashboard</span>
            </button>
            <button onclick="switchTab('tab-stock')" id="btn-tab-stock" class="flex items-center px-4 py-3 rounded-xl text-sm font-bold text-neutral-400">
                <i class="fa-solid fa-boxes-stacked w-5 mr-3"></i><span class="hide-mobile">ຈັດການສະຕ໊ອກ</span>
            </button>
            <button onclick="switchTab('tab-clock')" id="btn-tab-clock" class="flex items-center px-4 py-3 rounded-xl text-sm font-bold text-neutral-400">
                <i class="fa-solid fa-fingerprint w-5 mr-3"></i><span class="hide-mobile">ລົງເວລາເຮັດວຽກ</span>
            </button>

            <!-- HRM SECTION (HIDDEN FOR EMP) -->
            <div id="hrm-admin-menu" class="hidden pt-4 mt-4 border-t border-neutral-800 space-y-1">
                <button onclick="switchTab('tab-hrm-staff')" id="btn-tab-hrm-staff" class="flex items-center px-4 py-3 rounded-xl text-sm font-bold text-[#FF4D00]">
                    <i class="fa-solid fa-users-gear w-5 mr-3"></i><span class="hide-mobile">ຂໍ້ມູນພະນັກງານ</span>
                </button>
                <button onclick="switchTab('tab-hrm-payroll')" id="btn-tab-hrm-payroll" class="flex items-center px-4 py-3 rounded-xl text-sm font-bold text-[#FF4D00]">
                    <i class="fa-solid fa-calculator w-5 mr-3"></i><span class="hide-mobile">Payroll</span>
                </button>
            </div>
        </nav>

        <div class="switch-user-box p-4 border-t border-neutral-900 flex flex-col items-center">
            <button onclick="openPinModal()" id="btn-switch-user" class="w-full py-3 bg-neutral-900 rounded-xl text-[10px] font-black uppercase text-neutral-500 hover:text-white hover:bg-neutral-800 transition-all">
                <i class="fa-solid fa-shield-halved mr-2 text-orange-500"></i> HRM ADMIN LOGIN
            </button>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">

        <!-- TAB: DASHBOARD -->
        <section id="tab-dashboard" class="tab-content space-y-6">
            <header class="flex justify-between items-center flex-wrap gap-4">
                <h2 class="text-2xl font-black">Dashboard</h2>
                <div class="flex items-center -space-x-2" id="active-staff-container">
                    <!-- Active Avatars -->
                </div>
            </header>

            <!-- Categories Pills -->
            <div class="flex overflow-x-auto space-x-2 pb-2 scroll-hide" id="category-pills">
                <button onclick="filterCategory('ວັດຖຸດິບ')" class="category-pill active">ວັດຖຸດິບ</button>
                <button onclick="filterCategory('ເຄື່ອງໃຊ້ໃນຮ້ານ')" class="category-pill">ເຄື່ອງໃຊ້ໃນຮ້ານ</button>
                <button onclick="filterCategory('ໄຊຣັບ')" class="category-pill">ໄຊຣັບ</button>
                <button onclick="filterCategory('ເຄື່ອງດື່ມ')" class="category-pill">ເຄື່ອງດື່ມ</button>
                <button onclick="filterCategory('ALL')" class="category-pill">ທັງໝົດ</button>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4" id="dashboard-grid">
                <!-- Stock Cards -->
            </div>
        </section>

        <!-- TAB: STOCK (UPDATE & ADD NEW) -->
        <section id="tab-stock" class="tab-content hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-black">Inventory Update</h2>
                <button onclick="openAddProductModal()" class="px-5 py-2.5 bg-[#FF4D00] rounded-xl text-xs font-black shadow-lg shadow-[#FF4D00]/20">+ ເພີ່ມສິນຄ້າໃໝ່</button>
            </div>

            <div class="max-w-xl mx-auto glass-card p-6 md:p-8 space-y-6">
                <form onsubmit="handleInventoryRecord(event)" class="space-y-4">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-neutral-500 uppercase">ເລືອກສິນຄ້າ</label>
                        <select id="inv-sku" class="w-full text-sm font-bold"></select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-neutral-500 uppercase">ປະເພດ</label>
                            <select id="inv-type" class="w-full text-sm font-bold">
                                <option value="IN">ນຳເຂົ້າ (IN)</option>
                                <option value="OUT">ເບີກອອກ (OUT)</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-neutral-500 uppercase">ຈຳນວນ</label>
                            <input type="number" id="inv-qty" class="w-full text-sm font-bold" required placeholder="0">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-neutral-500 uppercase">ເຫດຜົນ</label>
                        <select id="inv-reason" onchange="toggleOtherReason(this.value)" class="w-full text-sm font-bold">
                            <option value="ຊື້ເພີ່ມ">ຊື້ເພີ່ມ</option>
                            <option value="ເຄື່ອງເສຍ/ເພ">ເຄື່ອງເສຍ/ເພ</option>
                            <option value="ນັບສະຕ໊ອກປະຈຳວັນ">ນັບສະຕ໊ອກປະຈຳວັນ</option>
                            <option value="other">ອື່ນໆ (ລະບຸເອງ)</option>
                        </select>
                        <input type="text" id="inv-reason-other" class="hidden w-full mt-2 text-sm" placeholder="ລະບຸເຫດຜົນຂອງທ່ານ...">
                    </div>
                    <button type="submit" class="w-full py-4 bg-[#FF4D00] rounded-2xl font-black text-sm uppercase">ບັນທຶກລາຍການ</button>
                </form>
            </div>
        </section>

        <!-- TAB: CLOCK -->
        <section id="tab-clock" class="tab-content hidden flex flex-col items-center justify-center min-h-[60vh] space-y-8">
            <div class="text-center">
                <h1 class="text-4xl font-black mb-2">Clock In / Out</h1>
                <p class="text-neutral-500">ໃສ່ລະຫັດ PIN 6 ຫຼັກ ເພື່ອລົງເວລາເຮັດວຽກ</p>
            </div>
            <div class="glass-card p-6 w-80 space-y-6">
                <input type="password" id="clock-pin" readonly class="w-full bg-black border-none text-center text-3xl font-bold tracking-[0.5em] text-[#FF4D00]">
                <div class="grid grid-cols-3 gap-3" id="clock-pinpad">
                    <!-- Pin pad generated by JS to prevent zoom -->
                </div>
            </div>
        </section>

        <!-- TAB: HRM STAFF -->
        <section id="tab-hrm-staff" class="tab-content hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-black">Staff Data</h2>
                <button onclick="openAddStaffModal()" class="px-5 py-2 bg-[#FF4D00] rounded-xl text-xs font-black">+ ເພີ່ມພະນັກງານ</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="staff-list"></div>
        </section>

        <!-- TAB: HRM PAYROLL -->
        <section id="tab-hrm-payroll" class="tab-content hidden space-y-6">
            <h2 class="text-2xl font-black">Payrolls Realtime (9h/Day)</h2>
            <div class="glass-card overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-neutral-900 text-neutral-500 uppercase font-black">
                        <tr>
                            <th class="p-4">ພະນັກງານ</th>
                            <th class="p-4 text-center">ຊົ່ວໂມງລວມ</th>
                            <th class="p-4 text-center">ມື້ເຮັດວຽກ (9ຊມ)</th>
                            <th class="p-4 text-right">ລາຍຮັບລວມ (LAK)</th>
                        </tr>
                    </thead>
                    <tbody id="payroll-body" class="divide-y divide-neutral-900"></tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- PIN MODAL FOR ADMIN -->
    <div id="pin-modal" class="fixed inset-0 bg-black/90 z-[300] hidden flex flex-col items-center justify-center p-6 backdrop-blur-md">
        <div class="w-full max-w-xs space-y-8">
            <div class="text-center space-y-2">
                <i class="fa-solid fa-shield-halved text-5xl text-[#FF4D00]"></i>
                <h3 class="text-xl font-black">ADMIN ACCESS</h3>
                <p class="text-xs text-neutral-500 uppercase">Enter 4-Digit Admin PIN</p>
            </div>
            <input type="password" id="admin-pin-display" readonly class="w-full bg-transparent border-b-2 border-[#FF4D00] text-center text-4xl font-bold tracking-[1em] text-white outline-none pb-4">
            <div class="grid grid-cols-3 gap-4" id="admin-pinpad"></div>
            <button onclick="closePinModal()" class="w-full py-4 text-neutral-500 font-bold uppercase text-xs">Cancel</button>
        </div>
    </div>

    <!-- ADD PRODUCT MODAL -->
    <div id="product-modal" class="fixed inset-0 bg-black/80 z-[250] hidden flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="glass-card w-full max-w-md p-8 space-y-6">
            <h3 class="text-xl font-black text-[#FF4D00]">Add New Product</h3>
            <form onsubmit="handleNewProduct(event)" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-neutral-500 uppercase">SKU (Auto)</label>
                    <input type="text" id="p-sku" readonly class="w-full font-mono font-bold text-orange-500">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-neutral-500 uppercase">ຊື່ສິນຄ້າ</label>
                    <input type="text" id="p-name" required class="w-full">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-neutral-500 uppercase">ໝວດໝູ່</label>
                    <select id="p-category" class="w-full">
                        <option value="ວັດຖຸດິບ">ວັດຖຸດິບ</option>
                        <option value="ເຄື່ອງໃຊ້ໃນຮ້ານ">ເຄື່ອງໃຊ້ໃນຮ້ານ</option>
                        <option value="ໄຊຣັບ">ໄຊຣັບ</option>
                        <option value="ເຄື່ອງດື່ມ">ເຄື່ອງດື່ມ</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-neutral-500 uppercase">ຈຳນວນເລີ່ມຕົ້ນ</label>
                    <input type="number" id="p-stock" required value="0" class="w-full">
                </div>
                <div class="flex space-x-3 pt-4">
                    <button type="button" onclick="closeAddProductModal()" class="flex-1 py-4 bg-neutral-900 rounded-2xl font-bold text-xs uppercase">Cancel</button>
                    <button type="submit" class="flex-1 py-4 bg-[#FF4D00] rounded-2xl font-black text-xs uppercase">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- DB & CONFIG ---
        const SUPABASE_URL = "https://jxkcnraixazvmwdfmraa.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4a2NucmFpeGF6dm13ZGZtcmFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2OTEzMjQsImV4cCI6MjEwMDI2NzMyNH0.qsu7QGAUT0IFR53FNXIMp52jS8DfTxl0GDAljA-T2T0";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let products = [], staff = [], attendance = [], currentCategory = 'ວັດຖຸດິບ';
        let adminPin = "", clockPin = "";

        // --- INIT ---
        async function init() {
            await fetchData();
            renderDashboard();
            renderActiveStaff();
            renderPinPads();
            populateSkuSelect();
        }

        async function fetchData() {
            const [p, s, a] = await Promise.all([
                db.from('main_inventory').select('*'),
                db.from('staff').select('*'),
                db.from('attendance').select('*')
            ]);
            products = p.data || [];
            staff = s.data || [];
            attendance = a.data || [];
        }

        // --- RENDERERS ---
        function renderDashboard() {
            const grid = document.getElementById('dashboard-grid');
            grid.innerHTML = "";
            
            const filtered = products.filter(p => currentCategory === 'ALL' || p.category === currentCategory);

            filtered.forEach(p => {
                const isUrgent = p.stock <= 5;
                grid.innerHTML += `
                    <div class="glass-card p-4 space-y-3">
                        <div class="flex justify-between items-start">
                            <span class="text-[9px] font-mono font-bold text-neutral-600">${p.sku}</span>
                            <span class="px-2 py-0.5 rounded-full text-[8px] font-black uppercase ${isUrgent ? 'bg-orange-500/20 text-orange-500' : 'bg-emerald-500/20 text-emerald-500'}">
                                ${isUrgent ? 'ຕ້ອງສັ່ງດ່ວນ!' : 'OK'}
                            </span>
                        </div>
                        <h4 class="font-black text-xs truncate" title="${p.name}">${p.name}</h4>
                        <div class="flex items-baseline space-x-1">
                            <span class="text-2xl font-black mono ${isUrgent ? 'text-orange-500' : 'text-emerald-500'}">${p.stock}</span>
                            <span class="text-[9px] font-bold text-neutral-600">UNIT</span>
                        </div>
                    </div>
                `;
            });
        }

        function renderActiveStaff() {
            const container = document.getElementById('active-staff-container');
            container.innerHTML = "";
            const today = new Date().toLocaleDateString();
            
            // Find staff who clocked in today and haven't clocked out (simplified)
            const activeStaff = staff.filter(s => {
                const logs = attendance.filter(a => a.pin === s.pin && new Date(a.timestamp).toLocaleDateString() === today);
                return logs.length % 2 !== 0;
            });

            activeStaff.forEach(s => {
                container.innerHTML += `
                    <div class="relative w-10 h-10">
                        <img src="${s.photo_url || 'https://via.placeholder.com/150'}" class="w-full h-full rounded-full object-cover border-2 border-black">
                        <div class="active-dot"></div>
                    </div>
                `;
            });
        }

        function renderPinPads() {
            const clockGrid = document.getElementById('clock-pinpad');
            const adminGrid = document.getElementById('admin-pinpad');
            const btns = ['1','2','3','4','5','6','7','8','9','C','0','OK'];
            
            clockGrid.innerHTML = btns.map(b => `<button onclick="handleClockPin('${b}')" class="pin-btn">${b}</button>`).join('');
            adminGrid.innerHTML = btns.map(b => `<button onclick="handleAdminPin('${b}')" class="pin-btn">${b}</button>`).join('');
        }

        // --- PIN LOGIC ---
        function handleClockPin(val) {
            if (val === 'C') clockPin = "";
            else if (val === 'OK') submitClock();
            else if (clockPin.length < 6) clockPin += val;
            document.getElementById('clock-pin').value = clockPin;
        }

        async function submitClock() {
            const user = staff.find(s => s.pin === clockPin);
            if (!user) { alert("PIN ບໍ່ຖືກຕ້ອງ"); clockPin = ""; return; }
            
            await db.from('attendance').insert([{ pin: clockPin, timestamp: new Date().toISOString(), branch: user.branch }]);
            alert("✅ ລົງເວລາສຳເລັດ: " + user.name);
            clockPin = ""; document.getElementById('clock-pin').value = "";
            init();
        }

        function handleAdminPin(val) {
            if (val === 'C') adminPin = "";
            else if (val === 'OK') {
                if (adminPin === "9999") { // Default Admin PIN
                    document.getElementById('hrm-admin-menu').classList.remove('hidden');
                    closePinModal();
                    switchTab('tab-hrm-staff');
                } else { alert("Admin PIN ບໍ່ຖືກຕ້ອງ"); adminPin = ""; }
            }
            else if (adminPin.length < 4) adminPin += val;
            document.getElementById('admin-pin-display').value = adminPin;
        }

        // --- INVENTORY LOGIC ---
        async function handleInventoryRecord(event) {
            event.preventDefault();
            const sku = document.getElementById('inv-sku').value;
            const type = document.getElementById('inv-type').value;
            const qty = parseInt(document.getElementById('inv-qty').value);
            const r = document.getElementById('inv-reason').value;
            const reason = r === 'other' ? document.getElementById('inv-reason-other').value : r;

            const prod = products.find(p => p.sku === sku);
            let newStock = type === 'IN' ? prod.stock + qty : prod.stock - qty;

            await db.from('main_inventory').update({ stock: newStock }).eq('sku', sku);
            await db.from('daily_inventory_movement').insert([{ sku, name: prod.name, type, qty, note: reason, timestamp: new Date().toISOString() }]);

            alert("✅ ບັນທຶກສະຕ໊ອກຮຽບຮ້ອຍ");
            init();
        }

        function openAddProductModal() {
            let max = 0;
            products.forEach(p => {
                const n = parseInt(p.sku.replace('P',''));
                if (n > max) max = n;
            });
            document.getElementById('p-sku').value = "P" + String(max + 1).padStart(3, '0');
            document.getElementById('product-modal').classList.remove('hidden');
        }

        async function handleNewProduct(e) {
            e.preventDefault();
            const payload = {
                sku: document.getElementById('p-sku').value,
                name: document.getElementById('p-name').value,
                category: document.getElementById('p-category').value,
                stock: parseInt(document.getElementById('p-stock').value)
            };
            await db.from('main_inventory').insert([payload]);
            alert("✅ ເພີ່ມສິນຄ້າໃໝ່ສຳເລັດ");
            closeAddProductModal();
            init();
        }

        // --- UI HELPERS ---
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active'));
            document.getElementById('btn-' + id).classList.add('tab-active');
            if (id === 'tab-hrm-staff') renderStaffList();
            if (id === 'tab-hrm-payroll') renderPayroll();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            renderDashboard();
        }

        function openPinModal() { document.getElementById('pin-modal').classList.remove('hidden'); adminPin = ""; }
        function closePinModal() { document.getElementById('pin-modal').classList.add('hidden'); }
        function closeAddProductModal() { document.getElementById('product-modal').classList.add('hidden'); }
        function toggleOtherReason(v) { document.getElementById('inv-reason-other').classList.toggle('hidden', v !== 'other'); }
        function populateSkuSelect() {
            document.getElementById('inv-sku').innerHTML = products.map(p => `<option value="${p.sku}">${p.name} (${p.sku})</option>`).join('');
        }

        function renderStaffList() {
            document.getElementById('staff-list').innerHTML = staff.map(s => `
                <div class="glass-card p-5 flex items-center space-x-4">
                    <img src="${s.photo_url || 'https://via.placeholder.com/150'}" class="w-16 h-16 rounded-2xl object-cover">
                    <div>
                        <h4 class="font-black text-sm">${s.name}</h4>
                        <p class="text-[10px] text-neutral-500 font-bold">${s.branch} | PIN: ${s.pin}</p>
                        <p class="text-[9px] text-[#FF4D00] font-black mt-1">${s.phone || 'ບໍ່ມີເບີໂທ'}</p>
                    </div>
                </div>
            `).join('');
        }

        function renderPayroll() {
            const body = document.getElementById('payroll-body');
            body.innerHTML = "";
            staff.forEach(s => {
                const logs = attendance.filter(a => a.pin === s.pin);
                let totalHrs = 0;
                // Calculate hours per day... (Simplified for demo)
                totalHrs = logs.length * 4; // Mock logic
                const workDays = totalHrs / 9;
                const totalPay = (s.salary / 26 * workDays) + (s.benefit || 0);

                body.innerHTML += `
                    <tr>
                        <td class="p-4 font-bold">${s.name}</td>
                        <td class="p-4 text-center mono">${totalHrs.toFixed(1)}</td>
                        <td class="p-4 text-center font-bold text-emerald-500">${workDays.toFixed(1)}</td>
                        <td class="p-4 text-right font-black text-[#FF4D00]">${Math.round(totalPay).toLocaleString()}</td>
                    </tr>
                `;
            });
        }

        window.onload = init;
    </script>
</body>
</html>
