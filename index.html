    <script>
        const S_URL = "https://jxkcnraixazvmwdfmraa.supabase.co";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4a2NucmFpeGF6dm13ZGZtcmFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2OTEzMjQsImV4cCI6MjEwMDI2NzMyNH0.qsu7QGAUT0IFR53FNXIMp52jS8DfTxl0GDAljA-T2T0";
        const client = supabase.createClient(S_URL, S_KEY);

        let products = [], staff = [], attendance = [], activeCategory = 'ວັດຖຸດິບ';
        let adminPin = "", clockPin = "", staffPhotoBase64 = "";

        // --- GMT+7 TIME ENGINE ---
        function getGMT7Time() {
            return new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Vientiane' }).replace('T', ' ');
        }

        async function init() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('live-time').innerText = now.toLocaleTimeString('en-GB', { timeZone: 'Asia/Vientiane', hour12: false });
                document.getElementById('live-date').innerText = now.toLocaleDateString('lo-LA', { timeZone: 'Asia/Vientiane', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            }, 1000);
            await fetchData(); renderDashboard(); renderActiveStaff(); renderPinPads(); populateSkuSelect();
        }

        async function fetchData() {
            const [p, s, a] = await Promise.all([
                client.from('main_inventory').select('*'),
                client.from('staff').select('*'),
                client.from('attendance').select('*').order('timestamp', { ascending: true })
            ]);
            // Strictly filter out XS SKUs
            products = (p.data || []).filter(item => !item.sku.toUpperCase().endsWith('XS'));
            staff = s.data || [];
            attendance = a.data || [];
        }

        function renderDashboard() {
            const grid = document.getElementById('dashboard-grid');
            const pills = document.getElementById('category-pills');
            grid.innerHTML = "";
            const cats = ['ວັດຖຸດິບ', ...new Set(products.map(p => p.category).filter(c => c !== 'ວັດຖຸດິບ'))];
            pills.innerHTML = cats.map(c => `<button onclick="filterCategory('${c}')" class="category-pill ${activeCategory === c ? 'active' : ''}">${c}</button>`).join('') + `<button onclick="filterCategory('ALL')" class="category-pill ${activeCategory === 'ALL' ? 'active' : ''}">ທັງໝົດ</button>`;
            
            products.filter(p => activeCategory === 'ALL' || p.category === activeCategory).forEach(p => {
                const isUrgent = p.stock <= (p.min_stock || 5);
                grid.innerHTML += `
                    <div class="glass-card p-5 space-y-3 border-t-4 ${isUrgent ? 'border-orange-500 shadow-orange-500/5' : 'border-emerald-500 shadow-emerald-500/5'}">
                        <div class="flex justify-between items-start">

                        </div>
                        <h4 class="font-black text-[13px] truncate text-neutral-200">${p.name}</h4>
                        <span class="text-3xl font-black mono ${isUrgent ? 'text-orange-500' : 'text-white'}">${p.stock}</span>
                    </div>`;
            });
        }

        function renderActiveStaff() {
            const container = document.getElementById('active-staff-container');
            container.innerHTML = "";
            const todayStr = getGMT7Time().split(' ')[0];
            const activeStaff = staff.filter(s => {
                const todayLogs = attendance.filter(a => a.pin === s.pin && a.timestamp.includes(todayStr));
                return todayLogs.length > 0 && todayLogs[todayLogs.length - 1].type === "Clock-In";
            });
            activeStaff.forEach(s => {
                container.innerHTML += `<div class="relative"><img src="${s.photo_url || 'https://via.placeholder.com/150'}" class="w-11 h-11 rounded-full object-cover border-2 border-black shadow-xl"><div class="active-dot"></div></div>`;
            });
        }

        async function submitClock() {
            const user = staff.find(s => s.pin === clockPin);
            const msg = document.getElementById('clock-msg');
            if (!user) { alert("PIN Wrong"); clockPin = ""; document.getElementById('clock-pin').value = ""; return; }
            
            const now = getGMT7Time();
            const todayStr = now.split(' ')[0];
            const todayLogs = attendance.filter(a => a.pin === clockPin && a.timestamp.includes(todayStr));
            
            const actionType = (todayLogs.length === 0 || todayLogs[todayLogs.length - 1].type === "Clock-Out") ? "Clock-In" : "Clock-Out";

            // EXPLICIT TYPE SENT TO PREVENT NULL
            const { error } = await client.from('attendance').insert([{ 
                pin: clockPin, timestamp: now, branch: user.branch, type: actionType 
            }]);

            if (actionType === "Clock-In") {
                msg.innerText = `✅ ${user.name}: ເຂົ້າວຽກສຳເລັດ!`;
                msg.style.color = "#10b981";
            } else {
                // FIXED TIME CALCULATION: MILLISECONDS SUBTRACTION
                const cin = todayLogs.find(l => l.type === "Clock-In");
                let workHrs = 0;
                if (cin) {
                    const startTs = new Date(cin.timestamp.replace(' ', 'T')).getTime();
                    const endTs = new Date(now.replace(' ', 'T')).getTime();
                    workHrs = Math.max(0, (endTs - startTs) / (1000 * 60 * 60));
                }
                msg.innerText = `✅ ${user.name}: ເຮັດວຽກມື້ນີ້ ${workHrs.toFixed(1)} ຊົ່ວໂມງ`;
                msg.style.color = "#FF4D00";
            }
            clockPin = ""; document.getElementById('clock-pin').value = "";
            await fetchData(); renderActiveStaff();
            setTimeout(() => msg.innerText = "", 5000);
        }

        function renderPayroll() {
            const body = document.getElementById('payroll-body');
            body.innerHTML = "";
            const now = new Date();
            const curM = now.getMonth();
            const curY = now.getFullYear();

            staff.forEach(s => {
                const monthLogs = attendance.filter(a => {
                    const d = new Date(a.timestamp.replace(' ', 'T'));
                    return a.pin === s.pin && d.getMonth() === curM && d.getFullYear() === curY;
                });

                const daily = {};
                monthLogs.forEach(l => {
                    const dStr = l.timestamp.split(' ')[0];
                    if (!daily[dStr]) daily[dStr] = [];
                    daily[dStr].push(l);
                });

                let totalHrs = 0, otHrs = 0;
                for (let d in daily) {
                    const logs = daily[d].sort((a,b) => new Date(a.timestamp.replace(' ', 'T')) - new Date(b.timestamp.replace(' ', 'T')));
                    const cin = logs.find(l => l.type === "Clock-In");
                    const cout = [...logs].reverse().find(l => l.type === "Clock-Out");

                    if (cin && cout) {
                        const dayHrs = (new Date(cout.timestamp.replace(' ', 'T')).getTime() - new Date(cin.timestamp.replace(' ', 'T')).getTime()) / (1000 * 60 * 60);
                        if (dayHrs > 0) {
                            totalHrs += dayHrs;
                            if (dayHrs > 9) otHrs += (dayHrs - 9);
                        }
                    }
                }
                const workDays = totalHrs / 9;
                const netPay = (s.salary / 26 * workDays) + (s.benefit || 0);
                body.innerHTML += `
                    <tr>
                        <td class="p-5 font-black text-neutral-200">${s.name}</td>
                        <td class="p-5 text-center font-bold">${totalHrs.toFixed(1)}</td>
                        <td class="p-5 text-center font-black text-emerald-500">${workDays.toFixed(1)}</td>
                        <td class="p-5 text-center font-black text-orange-500">${otHrs.toFixed(1)}</td>
                        <td class="p-5 text-right font-black text-orange-500">${Math.round(netPay).toLocaleString()}</td>
                    </tr>`;
            });
        }

        // Standard Helpers
        function previewStaffPhoto(input) { const reader = new FileReader(); reader.onload = (e) => { staffPhotoBase64 = e.target.result; document.getElementById('staff-photo-preview').src = staffPhotoBase64; }; if (input.files[0]) reader.readAsDataURL(input.files[0]); }
        async function handleStaffSave(e) { e.preventDefault(); const payload = { name: document.getElementById('s-name').value, pin: document.getElementById('s-pin').value, phone: document.getElementById('s-phone').value, dob: document.getElementById('s-dob').value, branch: document.getElementById('s-branch').value, shift: document.getElementById('s-shift').value, salary: parseInt(document.getElementById('s-salary').value), benefit: parseInt(document.getElementById('s-benefit').value), photo_url: staffPhotoBase64 }; await client.from('staff').insert([payload]); closeAddStaffModal(); init(); }
        function showStaffDetail(pin) { const s = staff.find(x => x.pin === pin); if (!s) return; document.getElementById('d-photo').src = s.photo_url || 'https://via.placeholder.com/150'; document.getElementById('d-name').innerText = s.name; document.getElementById('d-branch').innerText = s.branch; document.getElementById('d-phone').innerText = s.phone || '-'; document.getElementById('d-dob').innerText = s.dob || '-'; document.getElementById('d-shift').innerText = s.shift || '-'; document.getElementById('d-pin').innerText = s.pin; document.getElementById('staff-detail-modal').classList.remove('hidden'); }
        function filterCategory(c) { activeCategory = c; renderDashboard(); }
        function switchTab(id) { document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active')); document.getElementById('btn-' + id).classList.add('tab-active'); if (id === 'tab-hrm-staff') renderStaffList(); if (id === 'tab-hrm-payroll') renderPayroll(); }
        function renderStaffList() { document.getElementById('staff-list').innerHTML = staff.map(s => `<div onclick="showStaffDetail('${s.pin}')" class="glass-card p-5 flex items-center space-x-3 border-l-4 border-orange-500 cursor-pointer hover:bg-white/5 transition-all"><img src="${s.photo_url || 'https://via.placeholder.com/150'}" class="w-12 h-12 rounded-xl object-cover border border-white/5"><div><h4 class="font-black text-sm text-neutral-200">${s.name}</h4><p class="text-[8px] text-neutral-500 uppercase tracking-widest">${s.branch}</p></div></div>`).join(''); }
        function populateSkuSelect() { const sorted = products.sort((a,b) => a.sku.localeCompare(b.sku, undefined, {numeric: true})); document.getElementById('inv-sku').innerHTML = sorted.map(p => `<option value="${p.sku}">${p.sku} - ${p.name}</option>`).join(''); }
        async function handleInventoryRecord(e) { e.preventDefault(); const sku = document.getElementById('inv-sku').value; const type = document.getElementById('inv-type').value; const qty = parseInt(document.getElementById('inv-qty').value); const p = products.find(x => x.sku === sku); const newStock = type === 'IN' ? p.stock + qty : p.stock - qty; await client.from('main_inventory').update({ stock: newStock }).eq('sku', sku); await client.from('daily_inventory_movement').insert([{ sku, name: p.name, type, qty, note: document.getElementById('inv-reason').value, timestamp: getGMT7Time() }]); alert("Updated!"); init(); switchTab('tab-dashboard'); }
        async function handleNewProduct(e) { e.preventDefault(); const payload = { sku: document.getElementById('p-sku').value, name: document.getElementById('p-name').value, category: document.getElementById('p-category').value, min_stock: parseInt(document.getElementById('p-min').value), stock: parseInt(document.getElementById('p-stock').value) }; await client.from('main_inventory').insert([payload]); closeAddProductModal(); init(); }

        function renderPinPads() { const keys = ['1','2','3','4','5','6','7','8','9','C','0','OK']; const html = keys.map(k => `<button onclick="handlePin('${k}', this)" class="pin-btn">${k}</button>`).join(''); document.getElementById('clock-pinpad').innerHTML = html.replace(/handlePin/g, 'handleClockPin'); document.getElementById('admin-pinpad').innerHTML = html.replace(/handlePin/g, 'handleAdminPin'); }
        function handleClockPin(k) { if (k === 'C') clockPin = ""; else if (k === 'OK') submitClock(); else if (clockPin.length < 6) clockPin += k; document.getElementById('clock-pin').value = clockPin; }
        function handleAdminPin(k) { if (k === 'C') adminPin = ""; else if (k === 'OK') { if (adminPin === "9999") { document.getElementById('hrm-admin-menu').classList.remove('hidden'); closePinModal(); } else { alert("Error"); adminPin = ""; } } else if (adminPin.length < 4) adminPin += k; document.getElementById('admin-pin-display').value = adminPin; }
        function openPinModal() { document.getElementById('pin-modal').classList.remove('hidden'); adminPin = ""; }
        function closePinModal() { document.getElementById('pin-modal').classList.add('hidden'); }
        function closeStaffDetail() { document.getElementById('staff-detail-modal').classList.add('hidden'); }
        function openAddStaffModal() { document.getElementById('add-staff-modal').classList.remove('hidden'); }
        function closeAddStaffModal() { document.getElementById('add-staff-modal').classList.add('hidden'); staffPhotoBase64 = ""; }
        function openAddProductModal() { const next = "P" + String(products.length + 1).padStart(3, '0'); document.getElementById('p-sku').value = next; document.getElementById('product-modal').classList.remove('hidden'); }
        function closeAddProductModal() { document.getElementById('product-modal').classList.add('hidden'); }
        function toggleOtherReason(v) { document.getElementById('inv-reason-other').classList.toggle('hidden', v !== 'other'); }

        window.onload = init;
    </script>
</body>
</html>
