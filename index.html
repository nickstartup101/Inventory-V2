    <!-- MODALS -->

            <input type="password" id="admin-pin-display" readonly class="w-full bg-transparent border-b-2 border-orange-500 text-center text-5xl font-bold tracking-[0.5em] text-white pb-4 outline-none">

            <h3 class="text-2xl font-black">ເພີ່ມສິນຄ້າໃໝ່</h3>
            <form onsubmit="handleNewProduct(event)" class="space-y-4">
                <input type="text" id="p-sku" readonly class="font-mono text-orange-500 font-bold">
                <input type="text" id="p-name" placeholder="ຊື່ສິນຄ້າ" required>

                <input type="number" id="p-stock" placeholder="ຈຳນວນເລີ່ມຕົ້ນ" required>

                </div>
            </form>
        </div>

    <script>
        const S_URL = "https://jxkcnraixazvmwdfmraa.supabase.co";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4a2NucmFpeGF6dm13ZGZtcmFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2OTEzMjQsImV4cCI6MjEwMDI2NzMyNH0.qsu7QGAUT0IFR53FNXIMp52jS8DfTxl0GDAljA-T2T0";
        const client = supabase.createClient(S_URL, S_KEY);

        let products = [], staff = [], attendance = [], activeCategory = 'ວັດຖຸດິບ';
        let adminPin = "", clockPin = "";

        // --- TIMEZONE FIXED LOGIC ---
        function getLaosTime() {
            // ຄຳນວນເວລາລາວ (GMT+7)
            const now = new Date();
            const laosTime = new Date(now.getTime() + (7 * 60 * 60 * 1000));
            // ສ້າງ ISO String ທີ່ບໍ່ມີ 'Z' ເພື່ອໃຫ້ Supabase ເຂົ້າໃຈວ່າເປັນ Local Time
            return now.toLocaleString('sv-SE', { timeZone: 'Asia/Vientiane' }).replace(' ', 'T');
        }

        function updateLiveClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-GB', { timeZone: 'Asia/Vientiane', hour12: false });
            const dateStr = now.toLocaleDateString('lo-LA', { timeZone: 'Asia/Vientiane', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('live-time').innerText = timeStr;
            document.getElementById('live-date').innerText = dateStr;
        }

        async function init() {
            setInterval(updateLiveClock, 1000);
            await fetchData();
            renderDashboard();
            renderActiveStaff();
            renderPinPads();
            populateSkuSelect();
        }

        async function fetchData() {
            const [p, s, a] = await Promise.all([
                client.from('main_inventory').select('*'),
                client.from('staff').select('*'),
                client.from('attendance').select('*')
            ]);
            products = p.data || []; staff = s.data || []; attendance = a.data || [];
        }

        function renderDashboard() {
            const grid = document.getElementById('dashboard-grid');
            const pills = document.getElementById('category-pills');
            grid.innerHTML = "";
            const cats = ['ວັດຖຸດິບ', ...new Set(products.map(p => p.category).filter(c => c !== 'ວັດຖຸດິບ'))];
            pills.innerHTML = cats.map(c => `<button onclick="filterCategory('${c}')" class="category-pill ${activeCategory === c ? 'active' : ''}">${c}</button>`).join('') + `<button onclick="filterCategory('ALL')" class="category-pill ${activeCategory === 'ALL' ? 'active' : ''}">ທັງໝົດ</button>`;
            products.filter(p => activeCategory === 'ALL' || p.category === activeCategory).forEach(p => {
                const urgent = p.stock <= 5;
                grid.innerHTML += `
                    <div class="glass-card p-5 space-y-4 border-t-2 ${urgent ? 'border-orange-500' : 'border-emerald-500'}">
                        <div class="flex justify-between items-start">
                            <span class="text-[9px] font-mono font-bold text-neutral-600">${p.sku}</span>
                            <span class="px-2 py-0.5 rounded-lg text-[8px] font-black uppercase ${urgent ? 'text-orange-500 bg-orange-500/10' : 'text-emerald-500 bg-emerald-500/10'}">${urgent ? 'ຕ້ອງສັ່ງດ່ວນ!' : 'OK'}</span>
                        </div>
                        <h4 class="font-black text-xs truncate">${p.name}</h4>
                        <span class="text-3xl font-black mono ${urgent ? 'text-orange-500' : 'text-white'}">${p.stock}</span>
                    </div>`;
            });
        }

        function renderActiveStaff() {
            const container = document.getElementById('active-staff-container');
            container.innerHTML = "";
            const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Vientiane' });
            const activeStaff = staff.filter(s => {
                const logs = attendance.filter(a => a.pin === s.pin && a.timestamp.split('T')[0] === today);
                return logs.length % 2 !== 0;
            });
            activeStaff.forEach(s => {
                container.innerHTML += `<div class="relative"><img src="${s.photo_url || 'https://via.placeholder.com/150'}" class="w-10 h-10 rounded-full object-cover border-2 border-black ring-2 ring-neutral-900"><div class="active-dot"></div></div>`;
            });
        }

        function filterCategory(c) { activeCategory = c; renderDashboard(); }

        function renderPinPads() {
            const keys = ['1','2','3','4','5','6','7','8','9','C','0','OK'];
            const html = keys.map(k => `<button onclick="handlePinClick('${k}', this)" class="pin-btn">${k}</button>`).join('');
            document.getElementById('clock-pinpad').innerHTML = html.replace(/handlePinClick/g, 'handleClockPin');
            document.getElementById('admin-pinpad').innerHTML = html.replace(/handlePinClick/g, 'handleAdminPin');
        }

        function handleClockPin(k) {
            if (k === 'C') clockPin = "";
            else if (k === 'OK') submitClock();
            else if (clockPin.length < 6) clockPin += k;
            document.getElementById('clock-pin').value = clockPin;
        }

        async function submitClock() {
            const user = staff.find(s => s.pin === clockPin);
            const msg = document.getElementById('clock-msg');
            if (!user) { alert("PIN ບໍ່ຖືກຕ້ອງ"); clockPin = ""; document.getElementById('clock-pin').value = ""; return; }
            
            const laosTimeISO = getLaosTime(); // ສົ່ງເວລາລາວທີ່ແທ້ຈິງ
            const today = laosTimeISO.split('T')[0];
            const logs = attendance.filter(a => a.pin === clockPin && a.timestamp.split('T')[0] === today);
            
            await client.from('attendance').insert([{ pin: clockPin, timestamp: laosTimeISO, branch: user.branch }]);
            
            if (logs.length % 2 === 0) {
                msg.innerText = `✅ ${user.name}: ສຳເລັດແລ້ວ (ເຂົ້າວຽກ)`;
                msg.style.color = "#10b981";
            } else {
                const firstIn = new Date(logs[0].timestamp);
                const diff = (new Date(laosTimeISO) - firstIn) / (1000 * 60 * 60);
                msg.innerText = `✅ ${user.name}: ເຮັດວຽກມື້ນີ້ ${diff.toFixed(1)} ຊົ່ວໂມງ`;
                msg.style.color = "#FF4D00";
            }
            clockPin = ""; document.getElementById('clock-pin').value = "";
            fetchData().then(() => renderActiveStaff());
            setTimeout(() => msg.innerText = "", 5000);
        }

        function populateSkuSelect() {
            const filtered = products.filter(p => !p.sku.endsWith('XS')).sort((a,b) => a.sku.localeCompare(b.sku, undefined, {numeric: true}));
            document.getElementById('inv-sku').innerHTML = filtered.map(p => `<option value="${p.sku}">${p.sku} - ${p.name}</option>`).join('');
        }

        async function handleInventoryRecord(e) {
            e.preventDefault();
            const sku = document.getElementById('inv-sku').value;
            const type = document.getElementById('inv-type').value;
            const qty = parseInt(document.getElementById('inv-qty').value);
            const p = products.find(x => x.sku === sku);
            const newStock = type === 'IN' ? p.stock + qty : p.stock - qty;
            const laosTime = getLaosTime();

            await client.from('main_inventory').update({ stock: newStock }).eq('sku', sku);
            await client.from('daily_inventory_movement').insert([{ sku, name: p.name, type, qty, note: document.getElementById('inv-reason').value, timestamp: laosTime }]);
            alert("ບັນທຶກສຳເລັດ!"); init(); switchTab('tab-dashboard');
        }

        async function handleNewProduct(e) {
            e.preventDefault();
            const payload = { sku: document.getElementById('p-sku').value, name: document.getElementById('p-name').value, category: document.getElementById('p-category').value, stock: parseInt(document.getElementById('p-stock').value) };
            await client.from('main_inventory').insert([payload]); closeAddProductModal(); init();
        }

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active'));
            document.getElementById('btn-' + id).classList.add('tab-active');
            if (id === 'tab-hrm-staff') renderStaffList();
        }

        function handleAdminPin(k) {
            if (k === 'C') adminPin = "";
            else if (k === 'OK') { if (adminPin === "9999") { document.getElementById('hrm-admin-menu').classList.remove('hidden'); closePinModal(); } else { alert("PIN ຜິດ"); adminPin = ""; } }
            else if (adminPin.length < 4) adminPin += k;
            document.getElementById('admin-pin-display').value = adminPin;
        }

        function openPinModal() { document.getElementById('pin-modal').classList.remove('hidden'); adminPin = ""; }
        function closePinModal() { document.getElementById('pin-modal').classList.add('hidden'); }
        function openAddProductModal() { document.getElementById('p-sku').value = "P" + String(products.length + 1).padStart(3, '0'); document.getElementById('product-modal').classList.remove('hidden'); }
        function closeAddProductModal() { document.getElementById('product-modal').classList.add('hidden'); }
        function toggleOtherReason(v) { document.getElementById('inv-reason-other').classList.toggle('hidden', v !== 'other'); }
        function renderStaffList() { document.getElementById('staff-list').innerHTML = staff.map(s => `<div class="glass-card p-5 flex items-center space-x-4 border-l-4 border-orange-500"><img src="${s.photo_url || 'https://via.placeholder.com/150'}" class="w-16 h-16 rounded-2xl object-cover"><div><h4 class="font-black text-sm">${s.name}</h4><p class="text-[9px] text-neutral-500 font-bold uppercase">${s.branch} | PIN: ${s.pin}</p></div></div>`).join(''); }

        window.onload = init;
    </script>
</body>
</html>
