<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Dolce Portal V2 - HRM & Inventory</title>
    
    <!-- Dynamic Favicon V2 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23050505%22/><text y=%2272%22 x=%2212%22 font-family=%22sans-serif%22 font-size=%2268%22 font-weight=%22900%22 fill=%22%23FF4D00%22>V2</text></svg>">
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --primary: #FF4D00; --bg: #050505; --card: #0d0d0d; }
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { font-family: "Noto Sans Lao", sans-serif; background-color: var(--bg); color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* TOP BAR STICKY */
        #top-bar { height: 70px; background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid #1a1a1a; z-index: 200; position: sticky; top: 0; }

        aside { width: 260px; background: #0a0a0a; border-right: 1px solid #1a1a1a; transition: 0.3s; z-index: 100; }
        @media (max-width: 1024px) {
            aside { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; border-right: none; border-top: 1px solid #1a1a1a; flex-direction: row !important; padding: 0 !important; }
            aside .hide-mobile { display: none !important; }
            aside nav { flex-direction: row !important; justify-content: space-around; width: 100%; height: 100%; }
            aside nav button { flex-direction: column; font-size: 10px !important; padding: 10px 0 !important; }
            aside nav button i { margin: 0 0 4px 0 !important; font-size: 18px; }
            main { padding-top: 10px !important; padding-bottom: 90px !important; }
            .switch-user-box { display: none !important; }
        }

        .glass-card { background: var(--card); border: 1px solid #1a1a1a; border-radius: 24px; position: relative; overflow: hidden; }
        .tab-active { color: var(--primary) !important; background: rgba(255, 77, 0, 0.1) !important; }
        .mono { font-family: "JetBrains Mono", monospace; }

        /* ACTIVE PULSE */
        .active-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; position: absolute; bottom: 0; right: 0; border: 2px solid #000; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.7; } 70% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.7; } }

        /* PIN PAD */
        .pin-btn { height: 60px; border-radius: 18px; background: #161616; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.1s; }
        .pin-btn:active { background: var(--primary); color: white; transform: scale(0.95); }

        .category-pill { white-space: nowrap; padding: 10px 18px; border-radius: 14px; font-size: 12px; font-weight: 800; background: #111; color: #555; transition: 0.2s; border: 1px solid #1a1a1a; }
        .category-pill.active { background: var(--primary); color: white; border-color: var(--primary); }

        input, select, textarea { background: #111 !important; border: 1px solid #222 !important; color: white; border-radius: 14px; padding: 14px; outline: none; width: 100%; }
        input:focus { border-color: var(--primary) !important; }
        
        .status-ok { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .status-urgent { background: rgba(249, 115, 22, 0.1); color: #f97316; border: 1px solid rgba(249, 115, 22, 0.2); }
    </style>
</head>
<body class="lg:flex-row">

    <!-- TOP BAR -->
    <header id="top-bar" class="flex items-center justify-between px-6 shrink-0 no-print">
        <div class="flex items-center space-x-4">
            <span class="text-3xl font-black text-[#FF4D00]">V2</span>
            <div class="hidden sm:block">
                <p id="live-date" class="text-[10px] font-black text-neutral-500 uppercase tracking-widest"></p>
                <p id="live-time" class="text-xl font-black text-white leading-none"></p>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <span class="text-[9px] font-black text-neutral-500 uppercase mr-2 hidden md:block">Active Staff:</span>
            <div class="flex items-center -space-x-3" id="active-staff-container"></div>
        </div>
    </header>

    <!-- SIDEBAR -->
    <aside class="flex flex-col shrink-0 no-print">
        <nav class="flex-1 flex flex-col p-3 space-y-1">
            <button onclick="switchTab('tab-dashboard')" id="btn-tab-dashboard" class="flex items-center px-4 py-4 rounded-2xl text-sm font-bold text-neutral-400 tab-active">
                <i class="fa-solid fa-house-chimney w-5 mr-4"></i><span class="hide-mobile">ໜ້າຫຼັກ</span>
            </button>
            <button onclick="switchTab('tab-stock')" id="btn-tab-stock" class="flex items-center px-4 py-4 rounded-2xl text-sm font-bold text-neutral-400">
                <i class="fa-solid fa-box-open w-5 mr-4"></i><span class="hide-mobile">ຈັດການສະຕ໊ອກ</span>
            </button>
            <button onclick="switchTab('tab-clock')" id="btn-tab-clock" class="flex items-center px-4 py-4 rounded-2xl text-sm font-bold text-neutral-400">
                <i class="fa-solid fa-clock w-5 mr-4"></i><span class="hide-mobile">ລົງເວລາເຮັດວຽກ</span>
            </button>

            <div id="hrm-admin-menu" class="hidden pt-6 mt-6 border-t border-neutral-900 space-y-1">
                <p class="text-[9px] font-black text-neutral-600 uppercase px-4 mb-2 tracking-widest hide-mobile">Admin Panel</p>
                <button onclick="switchTab('tab-hrm-staff')" id="btn-tab-hrm-staff" class="flex items-center px-4 py-4 rounded-2xl text-sm font-bold text-orange-500">
                    <i class="fa-solid fa-id-card-clip w-5 mr-4"></i><span class="hide-mobile">ຂໍ້ມູນພະນັກງານ</span>
                </button>
                <button onclick="switchTab('tab-hrm-payroll')" id="btn-tab-hrm-payroll" class="flex items-center px-4 py-4 rounded-2xl text-sm font-bold text-orange-500">
                    <i class="fa-solid fa-coins w-5 mr-4"></i><span class="hide-mobile">Payroll</span>
                </button>
            </div>
        </nav>

        <div class="switch-user-box p-4 border-t border-neutral-900">
            <button onclick="openPinModal()" class="w-full py-3.5 bg-neutral-900 rounded-2xl text-[10px] font-black text-neutral-500 hover:text-orange-500 transition-all uppercase tracking-widest">
                <i class="fa-solid fa-key mr-2"></i> Switch to HRM
            </button>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8">

        <!-- TAB: DASHBOARD -->
        <section id="tab-dashboard" class="tab-content space-y-6">
            <div class="flex overflow-x-auto space-x-2 pb-4 scroll-hide" id="category-pills"></div>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4" id="dashboard-grid"></div>
        </section>

        <!-- TAB: STOCK -->
        <section id="tab-stock" class="tab-content hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-black">Stock Management</h2>
                <button onclick="openAddProductModal()" class="px-6 py-3 bg-[#FF4D00] rounded-2xl text-xs font-black">+ ເພີ່ມສິນຄ້າໃໝ່</button>
            </div>

            <div class="max-w-xl mx-auto glass-card p-8 space-y-6">
                <form onsubmit="handleInventoryRecord(event)" class="space-y-4">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-neutral-500 uppercase tracking-widest">ເລືອກສິນຄ້າ (ລຽງຕາມ P001)</label>
                        <select id="inv-sku" required></select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-neutral-500 uppercase tracking-widest">ປະເພດ</label>
                            <select id="inv-type">
                                <option value="IN">ນຳເຂົ້າ (IN)</option>
                                <option value="OUT">ເບີກອອກ (OUT)</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-neutral-500 uppercase tracking-widest">ຈຳນວນ</label>
                            <input type="number" id="inv-qty" required placeholder="0">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-neutral-500 uppercase tracking-widest">ເຫດຜົນການບັນທຶກ</label>
                        <select id="inv-reason" onchange="toggleOtherReason(this.value)">
                            <option value="ຊື້ເພີ່ມ">ຊື້ເພີ່ມ</option>
                            <option value="ເຄື່ອງເສຍ/ເພ">ເຄື່ອງເສຍ/ເພ</option>
                            <option value="ນັບສະຕ໊ອກປະຈຳວັນ">ນັບສະຕ໊ອກປະຈຳວັນ</option>
                            <option value="other">ອື່ນໆ (ລະບຸເອງ)</option>
                        </select>
                        <input type="text" id="inv-reason-other" class="hidden mt-2" placeholder="ລະບຸເຫດຜົນຂອງທ່ານ...">
                    </div>
                    <button type="submit" class="w-full py-4 bg-[#FF4D00] rounded-2xl font-black text-sm uppercase mt-4">ບັນທຶກສະຕ໊ອກ</button>
                </form>
            </div>
        </section>

        <!-- TAB: CLOCK -->
        <section id="tab-clock" class="tab-content hidden flex flex-col items-center justify-center min-h-[60vh] space-y-8">
            <div class="text-center">
                <h1 class="text-4xl font-black mb-2">ປ້ຳໂມງເຮັດວຽກ</h1>
                <p id="clock-msg" class="text-neutral-500 h-6 font-bold"></p>
            </div>
            <div class="glass-card p-8 w-80 space-y-6 border-t-4 border-orange-500">
                <input type="password" id="clock-pin" readonly class="bg-transparent border-none text-center text-4xl font-bold tracking-[0.4em] text-[#FF4D00]">
                <div class="grid grid-cols-3 gap-3" id="clock-pinpad"></div>
            </div>
        </section>

        <!-- HRM VIEW: STAFF -->
        <section id="tab-hrm-staff" class="tab-content hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-black">Staff Management</h2>
                <button onclick="openAddStaffModal()" class="px-5 py-2.5 bg-[#FF4D00] rounded-xl text-xs font-black">+ ເພີ່ມພະນັກງານ</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="staff-list"></div>
        </section>

    </main>

    <!-- ADMIN PIN MODAL -->
    <div id="pin-modal" class="fixed inset-0 bg-black/95 z-[300] hidden flex flex-col items-center justify-center p-6 backdrop-blur-xl">
        <div class="w-full max-w-xs space-y-10">
            <div class="text-center">
                <span class="text-5xl font-black text-orange-500">V2</span>
                <h3 class="text-xl font-black mt-4 uppercase tracking-widest">HRM Access</h3>
            </div>
            <input type="password" id="admin-pin-display" readonly class="w-full bg-transparent border-b-2 border-orange-500 text-center text-5xl font-bold tracking-[0.5em] text-white pb-4 outline-none">
            <div class="grid grid-cols-3 gap-4" id="admin-pinpad"></div>
            <button onclick="closePinModal()" class="w-full py-4 text-neutral-600 font-bold uppercase text-xs">Close</button>
        </div>
    </div>

    <!-- ADD PRODUCT MODAL -->
    <div id="product-modal" class="fixed inset-0 bg-black/90 z-[250] hidden flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="glass-card w-full max-w-md p-8 space-y-6 border-t-4 border-orange-500">
            <h3 class="text-2xl font-black">ເພີ່ມສິນຄ້າໃໝ່</h3>
            <form onsubmit="handleNewProduct(event)" class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-neutral-500 uppercase tracking-widest">SKU (ອັດໂຕໂນມັດ)</label>
                    <input type="text" id="p-sku" readonly class="font-mono text-orange-500 font-bold">
                </div>
                <div>
                    <label class="text-[10px] font-black text-neutral-500 uppercase tracking-widest">ຊື່ສິນຄ້າ</label>
                    <input type="text" id="p-name" required>
                </div>
                <div>
                    <label class="text-[10px] font-black text-neutral-500 uppercase tracking-widest">ໝວດໝູ່</label>
                    <input type="text" id="p-category" placeholder="ເຊັ່ນ: ວັດຖຸດິບ, ໄຊຣັບ..." required>
                </div>
                <div>
                    <label class="text-[10px] font-black text-neutral-500 uppercase tracking-widest">ຈຳນວນເລີ່ມຕົ້ນ</label>
                    <input type="number" id="p-stock" value="0" required>
                </div>
                <div class="flex space-x-3 pt-4">
                    <button type="button" onclick="closeAddProductModal()" class="flex-1 py-4 bg-neutral-900 rounded-2xl font-bold text-xs uppercase">Cancel</button>
                    <button type="submit" class="flex-1 py-4 bg-[#FF4D00] rounded-2xl font-black text-xs uppercase">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- SUPABASE CONFIG ---
        const S_URL = "https://jxkcnraixazvmwdfmraa.supabase.co";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4a2NucmFpeGF6dm13ZGZtcmFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2OTEzMjQsImV4cCI6MjEwMDI2NzMyNH0.qsu7QGAUT0IFR53FNXIMp52jS8DfTxl0GDAljA-T2T0";
        const client = supabase.createClient(S_URL, S_KEY);

        let products = [], staff = [], attendance = [], activeCategory = 'ວັດຖຸດິບ';
        let adminPin = "", clockPin = "";

        // --- CLOCK ENGINE ---
        function updateLiveTime() {
            const now = new Date();
            const options = { timeZone: 'Asia/Vientiane', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const dateOptions = { timeZone: 'Asia/Vientiane', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            
            document.getElementById('live-time').innerText = now.toLocaleTimeString('en-GB', options);
            document.getElementById('live-date').innerText = now.toLocaleDateString('lo-LA', dateOptions);
        }

        async function init() {
            setInterval(updateLiveTime, 1000);
            await fetchData();
            renderDashboard();
            renderActiveStaff();
            renderPinPads();
            populateSkuSelect();
        }

        async function fetchData() {
            const [p, s, a] = await Promise.all([
                client.from('main_inventory').select('*'),
                client.from('staff').select('*'),
                client.from('attendance').select('*')
            ]);
            products = p.data || [];
            staff = s.data || [];
            attendance = a.data || [];
        }

        // --- DASHBOARD ---
        function renderDashboard() {
            const grid = document.getElementById('dashboard-grid');
            const pills = document.getElementById('category-pills');
            grid.innerHTML = "";
            
            // Auto Categorization
            const cats = ['ວັດຖຸດິບ', ...new Set(products.map(p => p.category).filter(c => c !== 'ວັດຖຸດິບ'))];
            pills.innerHTML = cats.map(c => `
                <button onclick="filterCategory('${c}')" class="category-pill ${activeCategory === c ? 'active' : ''}">${c}</button>
            `).join('') + `<button onclick="filterCategory('ALL')" class="category-pill ${activeCategory === 'ALL' ? 'active' : ''}">ທັງໝົດ</button>`;

            const filtered = products.filter(p => activeCategory === 'ALL' || p.category === activeCategory);
            filtered.forEach(p => {
                const urgent = p.stock <= 5;
                grid.innerHTML += `
                    <div class="glass-card p-5 space-y-4 border-t-2 ${urgent ? 'border-orange-500' : 'border-emerald-500'}">
                        <div class="flex justify-between items-start">
                            <span class="text-[9px] font-mono font-bold text-neutral-600">${p.sku}</span>
                            <span class="px-2 py-0.5 rounded-lg text-[8px] font-black uppercase ${urgent ? 'status-urgent' : 'status-ok'}">
                                ${urgent ? 'ຕ້ອງສັ່ງດ່ວນ!' : 'OK'}
                            </span>
                        </div>
                        <h4 class="font-black text-xs truncate">${p.name}</h4>
                        <div class="flex items-baseline space-x-1">
                            <span class="text-3xl font-black mono ${urgent ? 'text-orange-500' : 'text-emerald-500'}">${p.stock}</span>
                            <span class="text-[9px] font-bold text-neutral-600">UNIT</span>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(c) { activeCategory = c; renderDashboard(); }

        function renderActiveStaff() {
            const container = document.getElementById('active-staff-container');
            container.innerHTML = "";
            const today = new Date().toLocaleDateString('en-GB');
            
            // Identify staff who are currently clocked in
            const activeStaff = staff.filter(s => {
                const logs = attendance.filter(a => a.pin === s.pin && new Date(a.timestamp).toLocaleDateString('en-GB') === today);
                return logs.length % 2 !== 0;
            });

            activeStaff.forEach(s => {
                container.innerHTML += `
                    <div class="relative group">
                        <img src="${s.photo_url || 'https://via.placeholder.com/150'}" class="w-10 h-10 rounded-full object-cover border-2 border-black ring-2 ring-neutral-900">
                        <div class="active-dot"></div>
                    </div>
                `;
            });
        }

        // --- SMART PIN PAD ---
        function renderPinPads() {
            const clockGrid = document.getElementById('clock-pinpad');
            const adminGrid = document.getElementById('admin-pinpad');
            const keys = ['1','2','3','4','5','6','7','8','9','C','0','OK'];
            
            const html = keys.map(k => `<button onclick="handlePin('${k}', event)" class="pin-btn">${k}</button>`).join('');
            clockGrid.innerHTML = html.replace(/handlePin/g, 'handleClockPin');
            adminGrid.innerHTML = html.replace(/handlePin/g, 'handleAdminPin');
        }

        function handleClockPin(k) {
            const msg = document.getElementById('clock-msg');
            if (k === 'C') clockPin = "";
            else if (k === 'OK') submitClock();
            else if (clockPin.length < 6) clockPin += k;
            document.getElementById('clock-pin').value = clockPin;
        }

        async function submitClock() {
            const user = staff.find(s => s.pin === clockPin);
            const msg = document.getElementById('clock-msg');
            if (!user) { alert("PIN ບໍ່ຖືກຕ້ອງ"); clockPin = ""; return; }
            
            const today = new Date().toLocaleDateString('en-GB');
            const logs = attendance.filter(a => a.pin === clockPin && new Date(a.timestamp).toLocaleDateString('en-GB') === today);
            
            await client.from('attendance').insert([{ pin: clockPin, timestamp: new Date().toISOString(), branch: user.branch }]);
            
            if (logs.length % 2 === 0) {
                msg.innerText = "✅ " + user.name + ": ສຳເລັດແລ້ວ (ເຂົ້າວຽກ)";
                msg.className = "text-emerald-500 font-bold";
            } else {
                const firstIn = new Date(logs[0].timestamp);
                const diff = (new Date() - firstIn) / (1000 * 60 * 60);
                msg.innerText = "✅ " + user.name + ": ເຮັດວຽກມື້ນີ້ " + diff.toFixed(1) + " ຊົ່ວໂມງ";
                msg.className = "text-orange-500 font-bold";
            }

            clockPin = ""; document.getElementById('clock-pin').value = "";
            fetchData().then(() => { renderActiveStaff(); });
            setTimeout(() => msg.innerText = "", 5000);
        }

        // --- SMART FILTER & SORT ---
        function populateSkuSelect() {
            const select = document.getElementById('inv-sku');
            // Filter out -XS and Sort P001, P002...
            const filtered = products
                .filter(p => !p.sku.endsWith('XS'))
                .sort((a,b) => a.sku.localeCompare(b.sku, undefined, {numeric: true, sensitivity: 'base'}));
            
            select.innerHTML = filtered.map(p => `<option value="${p.sku}">${p.sku} - ${p.name}</option>`).join('');
        }

        async function handleInventoryRecord(e) {
            e.preventDefault();
            const sku = document.getElementById('inv-sku').value;
            const type = document.getElementById('inv-type').value;
            const qty = parseInt(document.getElementById('inv-qty').value);
            const r = document.getElementById('inv-reason').value;
            const note = r === 'other' ? document.getElementById('inv-reason-other').value : r;

            const p = products.find(x => x.sku === sku);
            const newStock = type === 'IN' ? p.stock + qty : p.stock - qty;

            await client.from('main_inventory').update({ stock: newStock }).eq('sku', sku);
            await client.from('daily_inventory_movement').insert([{ sku, name: p.name, type, qty, note, timestamp: new Date().toISOString() }]);

            alert("บันທຶກສຳເລັດ!");
            init();
            switchTab('tab-dashboard');
        }

        function openAddProductModal() {
            const nextSku = "P" + String(products.length + 1).padStart(3, '0');
            document.getElementById('p-sku').value = nextSku;
            document.getElementById('product-modal').classList.remove('hidden');
        }

        async function handleNewProduct(e) {
            e.preventDefault();
            const payload = {
                sku: document.getElementById('p-sku').value,
                name: document.getElementById('p-name').value,
                category: document.getElementById('p-category').value,
                stock: parseInt(document.getElementById('p-stock').value)
            };
            await client.from('main_inventory').insert([payload]);
            closeAddProductModal();
            init();
        }

        // --- UI UTILS ---
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active'));
            document.getElementById('btn-' + id).classList.add('tab-active');
            if (id === 'tab-hrm-staff') renderStaffList();
        }

        function handleAdminPin(k) {
            if (k === 'C') adminPin = "";
            else if (k === 'OK') {
                if (adminPin === "9999") {
                    document.getElementById('hrm-admin-menu').classList.remove('hidden');
                    closePinModal();
                } else { alert("PIN ບໍ່ຖືກຕ້ອງ"); adminPin = ""; }
            }
            else if (adminPin.length < 4) adminPin += k;
            document.getElementById('admin-pin-display').value = adminPin;
        }

        function openPinModal() { document.getElementById('pin-modal').classList.remove('hidden'); adminPin = ""; document.getElementById('admin-pin-display').value = ""; }
        function closePinModal() { document.getElementById('pin-modal').classList.add('hidden'); }
        function closeAddProductModal() { document.getElementById('product-modal').classList.add('hidden'); }
        function toggleOtherReason(v) { document.getElementById('inv-reason-other').classList.toggle('hidden', v !== 'other'); }

        function renderStaffList() {
            document.getElementById('staff-list').innerHTML = staff.map(s => `
                <div class="glass-card p-5 flex items-center space-x-4 border-l-4 border-orange-500">
                    <img src="${s.photo_url || 'https://via.placeholder.com/150'}" class="w-16 h-16 rounded-2xl object-cover">
                    <div>
                        <h4 class="font-black text-sm">${s.name}</h4>
                        <p class="text-[9px] text-neutral-500 font-bold uppercase tracking-wider">${s.branch} | PIN: ${s.pin}</p>
                        <p class="text-[10px] text-orange-500 font-black mt-1">${s.phone || 'No Phone'}</p>
                    </div>
                </div>
            `).join('');
        }

        window.onload = init;
    </script>
</body>
</html>
